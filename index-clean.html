<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 空的 favicon，避免本地打开时控制台出现 404 请求 -->
  <link rel="icon" href="data:,">
  <title>英语单词卡片 · break</title>
  <style>
    /* ===== 基础样式 ===== */
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 18px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #f3f6fa;
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    /* 卡片列表：以后加多个单词时自动依次排开 */
    .card-list {
      width: 100%;
      max-width: 760px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      width: 100%;
      padding: 26px 24px 30px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 26px rgba(17, 39, 66, 0.08);
    }

    /* ===== 单词标题 ===== */
    .word-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .word {
      margin: 0;
      font-size: clamp(2.2rem, 8vw, 3.2rem);
      line-height: 1.15;
      letter-spacing: 0.01em;
      overflow-wrap: anywhere;
      color: #16233a;
    }

    .ipa { font-size: 0.85rem; color: #8b98ad; }

    /* ===== 中文 / 发音按钮 ===== */
    button {
      font-family: inherit;
      cursor: pointer;
      border-radius: 999px;
      transition: background-color 0.15s, color 0.15s, border-color 0.15s;
    }

    .speak {
      padding: 3px 9px;
      font-size: 0.72rem;
      color: #3355c5;
      background: #eff3ff;
      border: 1px solid #d7e0fb;
      white-space: nowrap;
      vertical-align: middle;
      margin-left: 4px;
    }
    .speak:hover { background: #e3ebff; }
    .speak.is-playing { background: #dfe7ff; color: #1f3aa8; }
    .speak:disabled {
      color: #9aa3b2;
      background: #f4f5f7;
      border-color: #e5e7eb;
      cursor: not-allowed;
    }

    .toggle {
      margin-top: 6px;
      padding: 4px 10px;
      font-size: 0.72rem;
      color: #475569;
      background: #f5f7fa;
      border: 1px solid #e5e9f0;
    }
    .toggle:hover { background: #eef1f6; }
    .toggle.is-open {
      color: #2b4acb;
      background: #eaf0ff;
      border-color: #bfd0f7;
    }

    /* ===== 英文 + 中文（默认隐藏）组件 ===== */
    .pair { margin-top: 10px; }
    .pair .en {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.65;
      color: #374151;
      overflow-wrap: anywhere;
    }
    .pair .cn {
      margin: 7px 0 0;
      padding: 8px 11px;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #64748b;
      background: #f8fafc;
      border-left: 3px solid #dbe3f0;
      border-radius: 0 8px 8px 0;
      overflow-wrap: anywhere;
    }

    /* ===== 分区 tab ===== */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 18px 0 4px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eef1f6;
    }
    .tab {
      padding: 7px 12px;
      font-size: 0.8rem;
      color: #475569;
      background: #f4f6fa;
      border: 1px solid #eef1f6;
      border-radius: 10px;
    }
    .tab:hover { background: #eef1f6; }
    .tab.is-active {
      color: #fff;
      background: #3157d5;
      border-color: #3157d5;
    }

    .tab-panel { padding-top: 8px; }

    .subtitle {
      margin: 18px 0 2px;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: #94a3b8;
      font-weight: 600;
    }

    /* ===== 义项列表（自定义折叠） ===== */
    .sense {
      margin-top: 10px;
      padding: 0 14px;
      background: #fcfdff;
      border: 1px solid #edf1f7;
      border-radius: 12px;
    }
    .sense-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 10px 0;
    }
    .sense-toggle {
      flex: 1 1 190px;
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 0;
      background: none;
      border: 0;
      border-radius: 0;
      text-align: left;
      font-size: 0.92rem;
      font-weight: 600;
      color: #23324a;
      overflow-wrap: anywhere;
    }
    .caret { color: #8b98ad; transition: transform 0.15s; }
    .sense.is-open .caret { transform: rotate(90deg); }
    .sense-title-cn {
      flex-basis: 100%;
      margin: 4px 0 0;
      padding: 7px 10px;
      font-size: 0.86rem;
      line-height: 1.6;
      color: #64748b;
      background: #f8fafc;
      border-left: 3px solid #dbe3f0;
      border-radius: 0 8px 8px 0;
      overflow-wrap: anywhere;
    }
    .sense-body {
      padding: 4px 0 14px;
      border-top: 1px solid #edf1f7;
    }
    .num {
      display: inline-block;
      margin-right: 6px;
      color: #8b98ad;
      font-variant-numeric: tabular-nums;
    }
    .why-label {
      margin: 14px 0 0;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      color: #9aa6b8;
    }

    /* ===== 速览：词典基础信息 ===== */
    .dict-block + .dict-block { margin-top: 16px; }
    .dict-label {
      margin: 0 0 8px;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: #94a3b8;
      font-weight: 600;
    }
    .pron-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .pron-row .speak { margin-left: 0; padding: 6px 12px; font-size: 0.82rem; }
    .meaning-line {
      margin: 4px 0;
      font-size: 0.95rem;
      line-height: 1.65;
      color: #374151;
    }
    .pos { margin-right: 6px; color: #5a76c9; font-weight: 600; }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 6px 0;
      border-bottom: 1px dashed #f0f3f8;
    }
    .form-row:last-child { border-bottom: 0; }
    .form-label { min-width: 4.2em; font-size: 0.8rem; color: #8b98ad; }
    .form-word { font-weight: 600; color: #16233a; }
    .mnemonic-box {
      padding: 12px;
      background: #fffdf5;
      border: 1px solid #f1e6c8;
      border-radius: 10px;
    }
    .badge-note {
      display: inline-block;
      margin-bottom: 6px;
      padding: 2px 7px;
      font-size: 0.66rem;
      color: #9a7b24;
      background: #fdf4dc;
      border: 1px solid #f0e1b4;
      border-radius: 999px;
    }
    .mnemonic-text {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.7;
      color: #4b5563;
      overflow-wrap: anywhere;
    }
    .dict-note {
      margin: 0;
      font-size: 0.92rem;
      line-height: 1.7;
      color: #4b5563;
      overflow-wrap: anywhere;
    }
    .deriv-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 5px 0;
      font-size: 0.92rem;
    }
    .deriv-word { font-weight: 600; color: #16233a; }
    .deriv-cn { color: #64748b; }

    /* ===== 语义地图 ===== */
    .map-core {
      padding: 12px;
      background: #f4f7ff;
      border: 1px solid #dde6fa;
      border-radius: 12px;
    }
    .map-arrow {
      margin: 4px 0;
      text-align: center;
      font-size: 1.1rem;
      color: #8fa3c8;
    }
    .map-chain {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 5px;
    }
    .chip {
      padding: 4px 8px;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      color: #3355c5;
      background: #eaf0ff;
      border: 1px solid #d7e0fb;
      border-radius: 999px;
    }
    .chain-arrow { font-size: 0.8rem; color: #9fb0d0; }

    .branches {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
    }
    .branch {
      padding: 12px;
      background: #fcfdff;
      border: 1px solid #edf1f7;
      border-radius: 12px;
    }
    .sense-ref {
      display: inline-block;
      margin-bottom: 2px;
      padding: 2px 7px;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      color: #fff;
      background: #5a76c9;
      border-radius: 999px;
    }

    /* ===== 词源 ===== */
    .etym-item {
      margin-top: 10px;
      padding: 12px;
      background: #fafcff;
      border-left: 3px solid #dbe3f0;
      border-radius: 0 10px 10px 0;
    }
    .etym-era {
      display: inline-block;
      margin-bottom: 2px;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      color: #5a76c9;
    }

    /* ===== 词缀 / 相似词条目 ===== */
    .affix,
    .similar-item {
      margin-top: 12px;
      padding: 12px;
      background: #fcfdff;
      border: 1px solid #edf1f7;
      border-radius: 12px;
    }
    .entry-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
    }
    .entry-word {
      font-size: 1rem;
      font-weight: 700;
      color: #16233a;
      overflow-wrap: anywhere;
    }
    .structure {
      padding: 3px 8px;
      font-size: 0.72rem;
      color: #7d8ba3;
      background: #f4f6fa;
      border: 1px solid #e7ebf3;
      border-radius: 6px;
      overflow-wrap: anywhere;
    }
    .tag {
      padding: 2px 7px;
      font-size: 0.66rem;
      letter-spacing: 0.05em;
      color: #5a76c9;
      background: #eef3ff;
      border: 1px solid #dbe5fb;
      border-radius: 999px;
    }

    /* ===== 联想记忆 ===== */
    .mnemonic-switch {
      margin-top: 10px;
      padding: 9px 16px;
      font-size: 0.88rem;
      color: #fff;
      background: #3157d5;
      border: 1px solid #3157d5;
      border-radius: 12px;
    }
    .mnemonic-switch:hover { background: #2848b8; }
    .mnemonic-panel { margin-top: 12px; }

    /* 纯 CSS 画的“完整 → 断裂”示意 */
    .crack-demo {
      margin: 6px 0 14px;
      padding: 16px 12px 14px;
      background: #f9fbff;
      border: 1px dashed #d7e0f0;
      border-radius: 12px;
      text-align: center;
    }
    .crack-force {
      margin-bottom: 8px;
      font-size: 0.66rem;
      letter-spacing: 0.16em;
      color: #8b98ad;
    }
    .crack-slab {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .crack-half {
      width: 72px;
      height: 54px;
      background: linear-gradient(180deg, #dbe7ff, #b6c9f5);
    }
    .crack-half.left {
      border-radius: 8px 2px 2px 8px;
      clip-path: polygon(0 0, 100% 0, 84% 16%, 95% 31%, 82% 47%, 94% 63%, 85% 80%, 100% 100%, 0 100%);
    }
    .crack-half.right {
      border-radius: 2px 8px 8px 2px;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 15% 80%, 6% 63%, 18% 47%, 5% 31%, 16% 16%);
    }
    .crack-caption {
      margin-top: 9px;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      color: #8b98ad;
    }
    .flow {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 10px;
    }
    .flow-seg { width: 62px; height: 3px; background: #a9bde8; border-radius: 2px; }
    .flow-gap { width: 3px; height: 12px; background: transparent; }

    /* ===== 窄屏调整 ===== */
    @media (max-width: 520px) {
      body { padding: 14px 12px; }
      .card { padding: 22px 18px 26px; border-radius: 14px; }
      .tabs { gap: 5px; }
      .tab { padding: 6px 10px; font-size: 0.76rem; }
      .sense { padding: 0 12px; }
      .crack-half { width: 64px; height: 48px; }
      .flow-seg { width: 48px; }
    }

    /* ================================================================
       以下为「交错记忆闭环」新增样式：
       学习/复习题面、状态条、词库浏览条。
       颜色与圆角继续沿用上面已有的浅色风格。
       ================================================================ */

    /* ===== 应用外壳 ===== */
    .page { width: 100%; max-width: 760px; margin: auto; }
    .app-head {
      margin-bottom: 14px;
      padding: 16px 18px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 26px rgba(17, 39, 66, 0.06);
    }
    .brand-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    .brand { margin: 0; font-size: 1.05rem; letter-spacing: 0.14em; color: #16233a; }
    .brand-sub { margin: 0; font-size: 0.72rem; color: #94a3b8; }
    .top-stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .stat {
      padding: 5px 10px;
      font-size: 0.72rem;
      line-height: 1.5;
      color: #475569;
      background: #f4f7fb;
      border: 1px solid #e8edf5;
      border-radius: 999px;
      overflow-wrap: anywhere;
    }
    .stat b { color: #3157d5; font-weight: 600; }
    .mode-switch { display: flex; gap: 8px; margin-top: 14px; }
    .mode-btn {
      flex: 1 1 0;
      min-width: 0;
      padding: 10px 12px;
      font-size: 0.86rem;
      line-height: 1.4;
      color: #475569;
      background: #f4f6fa;
      border: 1px solid #e8edf5;
      border-radius: 12px;
      overflow-wrap: anywhere;
    }
    .mode-btn:hover { background: #eef1f6; }
    .mode-btn.is-active { color: #fff; background: #3157d5; border-color: #3157d5; }

    /* ===== 学习 / 复习卡片 ===== */
    .study-card {
      padding: 20px 20px 24px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 26px rgba(17, 39, 66, 0.08);
    }
    .study-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      font-size: 0.72rem;
      color: #64748b;
    }
    .head-item { padding: 4px 9px; background: #f6f8fb; border: 1px solid #edf1f7; border-radius: 999px; }
    .head-item b { color: #3157d5; font-weight: 600; }
    .pill {
      padding: 3px 9px;
      font-size: 0.7rem;
      color: #3355c5;
      background: #eef3ff;
      border: 1px solid #d7e0fb;
      border-radius: 999px;
    }
    .quiz-body { margin-top: 16px; }
    .quiz-progress {
      margin: 0;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: #94a3b8;
    }
    .quiz-tip { margin: 6px 0 0; font-size: 0.76rem; color: #8b98ad; overflow-wrap: anywhere; }
    .quiz-word {
      margin: 10px 0 0;
      font-size: clamp(1.8rem, 7vw, 2.6rem);
      line-height: 1.2;
      color: #16233a;
      overflow-wrap: anywhere;
    }
    .quiz-ipa { margin: 2px 0 0; font-size: 0.82rem; color: #8b98ad; overflow-wrap: anywhere; }
    .quiz-def {
      margin: 10px 0 0;
      font-size: 1.12rem;
      font-weight: 600;
      line-height: 1.6;
      color: #23324a;
      overflow-wrap: anywhere;
    }
    .quiz-scene {
      margin: 10px 0 0;
      padding: 13px 14px;
      font-size: 1rem;
      line-height: 1.75;
      color: #334155;
      background: #f8fafc;
      border-left: 3px solid #dbe3f0;
      border-radius: 0 10px 10px 0;
      overflow-wrap: anywhere;
    }
    /* 场景示意：内联 SVG，宽度自适应，移动端不溢出 */
    .scene-art {
      width: 100%;
      margin: 10px 0 4px;
      padding: 10px 10px 8px;
      background: #fbfdff;
      border: 1px solid #e5e9f0;
      border-radius: 12px;
      text-align: center;
    }
    .scene-art svg {
      display: block;
      width: 100%;
      max-width: 260px;
      height: auto;
      margin: 0 auto;
    }
    .scene-art figcaption {
      margin-top: 6px;
      font-size: 0.72rem;
      line-height: 1.5;
      color: #64748b;
      overflow-wrap: anywhere;
    }
    .scene-art figcaption::before { content: "场景："; color: #94a3b8; }
    .word-scene {
      margin: 8px 0 0;
      font-size: 0.92rem;
      line-height: 1.65;
      color: #334155;
      overflow-wrap: anywhere;
    }
    .word-scene-cn {
      margin: 4px 0 0;
      padding: 8px 11px;
      font-size: 0.86rem;
      line-height: 1.6;
      color: #64748b;
      background: #f8fafc;
      border-left: 3px solid #dbe3f0;
      border-radius: 0 8px 8px 0;
      overflow-wrap: anywhere;
    }
    .audio-box {
      margin-top: 12px;
      padding: 16px 14px;
      text-align: center;
      background: #f9fbff;
      border: 1px dashed #d7e0f0;
      border-radius: 12px;
    }
    .audio-box .speak {
      margin: 0;
      padding: 10px 18px;
      font-size: 0.9rem;
    }

    /* 选项按钮 */
    .options { display: grid; gap: 9px; margin-top: 16px; }
    .option {
      width: 100%;
      min-height: 46px;
      padding: 12px 14px;
      font-size: 0.92rem;
      line-height: 1.5;
      text-align: left;
      color: #23324a;
      background: #fbfcff;
      border: 1px solid #e3e9f2;
      border-radius: 12px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .option:hover { background: #f3f6fc; border-color: #cfdbf0; }
    .option:disabled { cursor: default; }
    .option.is-correct { color: #1d6b3a; background: #eefaf1; border-color: #b7e4c5; }
    .option.is-wrong { color: #9a4a4a; background: #fff5f5; border-color: #f2cdcd; }
    .option.is-highlight {
      color: #1f3aa8;
      background: #eef3ff;
      border-color: #3157d5;
      box-shadow: 0 0 0 2px rgba(49, 87, 213, 0.12);
    }

    /* 答题提示区 / 答案完整展示 / 回撤 */
    .quiz-audio { margin-top: 8px; }
    .answer-full {
      margin-top: 12px;
      padding: 12px 13px;
      background: #fbfcff;
      border: 1px solid #dfe7f5;
      border-radius: 12px;
    }
    .answer-word-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .answer-word { font-size: 1.25rem; font-weight: 700; color: #16233a; overflow-wrap: anywhere; }
    .answer-def { margin: 8px 0 0; font-size: 0.92rem; line-height: 1.65; color: #334155; overflow-wrap: anywhere; }
    .answer-scene { margin: 8px 0 0; font-size: 0.88rem; line-height: 1.65; color: #64748b; overflow-wrap: anywhere; }
    .answer-sense { margin-top: 10px; padding-top: 9px; border-top: 1px dashed #e4eaf4; }
    .answer-sense-label { margin: 0; font-size: 0.68rem; letter-spacing: 0.08em; color: #94a3b8; }
    .answer-sense-title { margin: 4px 0 0; font-size: 0.9rem; font-weight: 600; color: #23324a; overflow-wrap: anywhere; }
    .answer-sense-text { margin: 4px 0 0; font-size: 0.85rem; line-height: 1.6; color: #64748b; overflow-wrap: anywhere; }
    .feedback-note { margin: 10px 0 0; font-size: 0.82rem; line-height: 1.6; color: #8a5b1f; overflow-wrap: anywhere; }
    .undo-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .undo-row .undo-btn { margin-top: 0; }
    .undo-btn.is-used { color: #9aa3b2; background: #f4f5f7; border-color: #e5e7eb; }
    .undo-bar { margin-top: 12px; }

    /* 复习回想关 */
    .recall-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .recall-row .btn-primary,
    .recall-row .btn-ghost { margin-top: 0; }
    .recall-result {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #e5e9f0;
    }
    .recall-result.is-ok { background: #f2fbf5; border-color: #cbe8d5; }
    .recall-result.is-no { background: #fff8ec; border-color: #f1e1bf; }
    .recall-title { margin: 0; font-size: 0.92rem; font-weight: 600; color: #23324a; overflow-wrap: anywhere; }
    .recall-result .quiz-tip { margin-top: 6px; }

    /* 阶段 1 完整词条 / 说阶段提示 */

    function levenshtein(a, b) {
      const rows = Array.from({ length: a.length + 1 }, (_, i) => [i]);
      for (let j = 1; j <= b.length; j += 1) rows[0][j] = j;
      for (let i = 1; i <= a.length; i += 1) {
        for (let j = 1; j <= b.length; j += 1) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          rows[i][j] = Math.min(rows[i - 1][j] + 1, rows[i][j - 1] + 1, rows[i - 1][j - 1] + cost);
        }
      }
      return rows[a.length][b.length];

      const last = word[word.length - 1];
      forms.add(`${word}${last}ing`);
      forms.add(`${word}${last}ed`);
      (IRREGULAR_FORMS[word] || []).forEach((item) => forms.add(item));

      // 长词优先，避免 break 先把 broke 的一部分替换掉
      const ordered = [...forms].sort((a, b) => b.length - a.length);
      for (const form of ordered) {
        const regex = new RegExp(`\\b${escapeRegExp(form)}\\b`, "i");
        if (regex.test(scene)) {
          return { text: scene.replace(regex, "____"), form };
        }
      }
      return { text: scene, form: word };
    }

    // ============================================================
    // 3. 日期工具
    //    整个 SRS 只通过 getToday() 取“今天”；
    //    getToday() 直接返回系统日期。
    // ============================================================
    let state = null;

    function realToday() {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    }

    function getToday() {
      return realToday();
    }

    // 本地时区的 YYYY-MM-DD（不要用 toISOString，避免时区把日期挪一天）
    function dateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function parseDateKey(key) {
      const [y, m, d] = key.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function addDaysKey(key, days) {
      const date = parseDateKey(key);
      date.setDate(date.getDate() + days);
      return dateKey(date);
    }

    function daysFromToday(key) {
      return Math.round((parseDateKey(key) - getToday()) / 86400000);
    }

    function dueText(key) {
      if (!key) return "—";
      const diff = daysFromToday(key);
      if (diff < 0) return `${key}（已到期 ${-diff} 天）`;
      if (diff === 0) return `${key}（今天）`;
      return `${key}（还有 ${diff} 天）`;
    }

    // ============================================================
    // 4. 本地状态（localStorage）
    // ============================================================
    const STORAGE_KEY = "lizzword_state_v1";
    const SRS_INTERVALS = [2, 4, 10, 25, 30, 50]; // 节点 0..5
    const STAGE_LABELS = { stage1: "认词", stage2: "中→英", stage2b: "英→中", write: "写", speak: "说", done: "已完成" };
    const COOL_MIN = 3; // 同一个词两次出现之间，至少隔 3 个其他词的作答
    const COOL_MAX = 7; // 最多隔 7 个；每次作答后随机取 3–7
    const MIN_LEARN_BATCH = 10; // 已备内容不足 10 个时不开新学，提示补充词条

    function allWordIds() {
      return words.map((item) => item.word);
    }

    // 今日学习会话的词表；没有会话时退回整本已备词池
    function sessionWordIds() {
      const list = state && Array.isArray(state.learnWords) ? state.learnWords : [];
      const known = new Set(allWordIds());
      const filtered = list.filter((id) => known.has(id));
      return filtered.length ? filtered : allWordIds();
    }

    function sessionWordCount() {
      return sessionWordIds().length;
    }

    function initState() {
      return {
        bookId: DEFAULT_BOOK_ID,            // 当前选中的词书，持久化后刷新不变
        stage: "stage1",
        queue: [],                          // 阶段 1：待认词（进入新学时按每日目标抽取）
        learnWords: [],                     // 今日会话词表：按打乱顺序抽取，抽好即固定
        previewBatch: [],                   // 预抽好的下一批，持久化后当天刷新不变
        previewBatchDate: "",               // 预抽批次对应的日期
        learnedEver: [],                    // 已学过的词，预习据此取下一批
        dailyTarget: 10,                    // 每天学习 10 / 15 / 20
        stage1Done: [],
        stage2Queue: [],                    // 阶段 2：待看中文选英文
        stage2Done: [],
        stage2bQueue: [],                   // 阶段 3：待看英文选中文
        stage2bDone: [],
        writeQueue: [],
        writeDone: [],
        speakQueue: [],
        speakDone: [],
        introSeen: [],                      // 已经展示过完整词条的词
        stageWrong: { s1: 0, s2: 0, s2b: 0, s3: 0, s4: 0 },
        learnStartedMs: 0,
        learnSummary: null,
        todayDoneAt: "",
        groupStatsDate: "",
        groupsToday: 0,
        wordsToday: 0,
        reviewPool: {},
        reviewSession: null,
        srsHistory: [],
        wrongCount: 0,
        wrongDate: "",
        answerSeq: 0,
        lastSeen: {},
        cooldownUntil: {},
        startedAt: dateKey(realToday())
      };
    }

    function uniqueKnown(list, known) {
      return [...new Set((Array.isArray(list) ? list : []).filter((item) => known.has(item)))];
    }

    function normalizeWrongCounts(value) {
      const src = value && typeof value === "object" ? value : {};
      return {
        s1: Number(src.s1) || 0,
        s2: Number(src.s2) || 0,
        s2b: Number(src.s2b) || 0,
        s3: Number(src.s3) || 0,
        s4: Number(src.s4) || 0
      };
    }

    function normalizeReviewSession(value) {
      if (!value || typeof value !== "object") return null;
      const str = (v) => (typeof v === "string" ? v : "");
      const list = (v) => (Array.isArray(v) ? v.filter((x) => typeof x === "string") : []);
      const normalized = {
        date: str(value.date),
        startMs: Number(value.startMs) || 0,
        due: list(value.due),
        recallQueue: list(value.recallQueue),
        recallPassed: list(value.recallPassed),
        recallWrong: Number(value.recallWrong) || 0,
        // 旧版会话没有回想关字段：已经开始正式轮次的直接视为已通过回想关
        recallDone: value.recallDone === true || (!Array.isArray(value.recallQueue) && (list(value.r1).length > 0 || list(value.r1Passed).length > 0 || list(value.writeDone).length > 0)),
        r1: list(value.r1),
        r1Passed: list(value.r1Passed),
        r2: list(value.r2),
        r2Passed: list(value.r2Passed),
        writeQueue: list(value.writeQueue),
        writeDone: list(value.writeDone),
        speakQueue: list(value.speakQueue),
        speakDone: list(value.speakDone),
        hadWrong: value.hadWrong && typeof value.hadWrong === "object" ? value.hadWrong : {},
        graded: list(value.graded),
        correctCount: Number(value.correctCount) || 0,
        wrongCount: Number(value.wrongCount) || 0,
        summary: value.summary && typeof value.summary === "object" ? value.summary : null
      };
      if (normalized.recallPassed.length >= normalized.due.length && normalized.due.length > 0) {
        normalized.recallDone = true;
      }
      return normalized;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === "object") {
            const known = new Set(allWordIds());
            // 深度内容尚未入库时词表为空，此时保留存档里的进度，避免把已学记录清空
            const pick = (list) => (known.size
              ? uniqueKnown(list, known)
              : (Array.isArray(list) ? list.filter((x) => typeof x === "string") : []));

            let queue = pick(parsed.queue);
            let learnWords = pick(parsed.learnWords);
            const learnedEver = pick(parsed.learnedEver);
            const dailyTarget = [10, 15, 20].includes(Number(parsed.dailyTarget)) ? Number(parsed.dailyTarget) : 10;
            let stage1Done = pick(parsed.stage1Done);
            let stage2Queue = pick(parsed.stage2Queue);
            let stage2Done = pick(parsed.stage2Done);
            let stage2bQueue = pick(parsed.stage2bQueue);
            let stage2bDone = pick(parsed.stage2bDone);
            let writeQueue = pick(parsed.writeQueue);
            let writeDone = pick(parsed.writeDone);
            let speakQueue = pick(parsed.speakQueue);
            let speakDone = pick(parsed.speakDone);
            const introSeen = pick(parsed.introSeen);

            let stage = parsed.stage === "recognize" ? "stage1" : parsed.stage;
            if (!["stage1", "stage2", "stage2b", "write", "speak", "done"].includes(stage)) {
              stage = parsed.todayDoneAt ? "done" : "stage1";
            }

            // 旧状态没有 learnWords 时才用各阶段队列反推；完全没有进度就保持空，
            // 等进入新学时再抽，避免加载页面时悄悄把整库当成今日队列
            if (!learnWords.length) {
              const union = [...queue, ...stage1Done, ...stage2Queue, ...stage2Done, ...stage2bQueue, ...stage2bDone, ...writeQueue, ...writeDone, ...speakQueue, ...speakDone];
              learnWords = [...new Set(union)].filter((id) => (known.size ? known.has(id) : true));
            }
            const learnIds = learnWords;

            // 兼容旧版状态：没有“英→中”字段且已经进入写/说/完成的，视为该轮已过
            if (!Array.isArray(parsed.stage2bDone)) {
              stage2bDone = ["write", "speak", "done"].includes(stage) ? learnIds : [];
            }

            // 兼容上一版状态：旧 queue 是“认得”队列，已移出的词视为通过阶段 1
            if (!Array.isArray(parsed.stage1Done)) {
              const all = learnIds;
              if (stage === "stage1") {
                stage1Done = all.filter((id) => !queue.includes(id));
                stage2Queue = stage1Done.slice();
                stage2Done = [];
              } else {
                stage1Done = all.slice();
                stage2Queue = [];
                stage2Done = all.slice();
              }
            }

            // 阶段进度一律以 done 列表为准：取最早没有全员通过的阶段。
            // 答错把某个词从后续阶段移除后，刷新回来也会停在正确位置。
            if (parsed.stage === "done" || stage === "done") {
              stage1Done = learnIds.slice();
              stage2Done = learnIds.slice();
              stage2bDone = learnIds.slice();
              speakDone = learnIds.slice();
              writeDone = learnIds.slice();
              stage = "done";
            } else if (learnIds.length) {
              const full = (list) => learnIds.every((id) => list.includes(id));
              if (!full(stage1Done)) {
                stage = "stage1";
                if (!queue.length) queue = learnIds.filter((id) => !stage1Done.includes(id));
              } else if (!full(stage2Done)) {
                stage = "stage2";
                if (!stage2Queue.length) stage2Queue = learnIds.filter((id) => !stage2Done.includes(id));
              } else if (!full(stage2bDone)) {
                stage = "stage2b";
                if (!stage2bQueue.length) stage2bQueue = learnIds.filter((id) => !stage2bDone.includes(id));
              } else if (!full(speakDone)) {
                stage = "speak";
                if (!speakQueue.length) speakQueue = learnIds.filter((id) => !speakDone.includes(id));
              } else if (!full(writeDone)) {
                stage = "write";
                if (!writeQueue.length) writeQueue = learnIds.filter((id) => !writeDone.includes(id));
              } else {
                stage = "done";
              }
            }

            const lastSeen = {};
            if (parsed.lastSeen && typeof parsed.lastSeen === "object") {
              Object.keys(parsed.lastSeen).forEach((id) => {
                if (known.has(id)) lastSeen[id] = Number(parsed.lastSeen[id]) || 0;
              });
            }
            const cooldownUntil = {};
            if (parsed.cooldownUntil && typeof parsed.cooldownUntil === "object") {
              Object.keys(parsed.cooldownUntil).forEach((id) => {
                if (known.has(id)) cooldownUntil[id] = Number(parsed.cooldownUntil[id]) || 0;
              });
            }

            return {
              bookId: BOOKS.some((item) => item.id === parsed.bookId) ? parsed.bookId : DEFAULT_BOOK_ID,
              stage,
              queue,
              learnWords,
              previewBatch: uniqueKnown(parsed.previewBatch, known),
              previewBatchDate: parsed.previewBatchDate || "",
              learnedEver,
              dailyTarget,
              stage1Done,
              stage2Queue,
              stage2Done,
              stage2bQueue,
              stage2bDone,
              writeQueue,
              writeDone,
              speakQueue,
              speakDone,
              introSeen,
              stageWrong: normalizeWrongCounts(parsed.stageWrong),
              learnStartedMs: Number(parsed.learnStartedMs) || 0,
              learnSummary: parsed.learnSummary && typeof parsed.learnSummary === "object" ? parsed.learnSummary : null,
              todayDoneAt: parsed.todayDoneAt || "",
              groupStatsDate: parsed.groupStatsDate || "",
              groupsToday: Number(parsed.groupsToday) || 0,
              wordsToday: Number(parsed.wordsToday) || 0,
              reviewPool: parsed.reviewPool && typeof parsed.reviewPool === "object" ? parsed.reviewPool : {},
              reviewSession: normalizeReviewSession(parsed.reviewSession),
              srsHistory: Array.isArray(parsed.srsHistory) ? parsed.srsHistory : [],
              wrongCount: Number(parsed.wrongCount) || 0,
              wrongDate: parsed.wrongDate || "",
              answerSeq: Number(parsed.answerSeq) || 0,
              lastSeen,
              cooldownUntil,
              startedAt: parsed.startedAt || dateKey(realToday())
            };
          }
        }
      } catch (error) {
        // localStorage 不可用或内容损坏时，直接回到初始状态
      }
      return initState();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (error) {
        // 隐私模式等情况下写不进去，页面仍可继续使用
      }
    }

    function todayWrongCount() {
      return state.wrongDate === dateKey(getToday()) ? state.wrongCount : 0;
    }

    function bumpWrong() {
      const today = dateKey(getToday());
      if (state.wrongDate !== today) {
        state.wrongDate = today;
        state.wrongCount = 0;
      }
      state.wrongCount += 1;
    }

    function bumpStageWrong(key) {
      if (!state.stageWrong[key]) state.stageWrong[key] = 0;
      state.stageWrong[key] += 1;
    }

    // ============================================================
    // 5. 复习池（SRS）
    // ============================================================
    function getDueWords() {
      const today = dateKey(getToday());
      return words
        .map((item) => item.word)
        .filter((wordId) => {
          const entry = state.reviewPool[wordId];
          return Boolean(entry && !entry.mastered && entry.due && entry.due <= today && entry.lastReviewed !== today);
        });
    }

    function getNextReview() {
      let best = null;
      words.forEach((item) => {
        const entry = state.reviewPool[item.word];
        if (entry && !entry.mastered && entry.due) {
          if (!best || entry.due < best.due) best = entry;
        }
      });
      return best;
    }

    function countMastered() {
      return words.filter((item) => {
        const entry = state.reviewPool[item.word];
        return Boolean(entry && entry.mastered);
      }).length;
    }

    // 首次复习排期：阶段 1、2 全程无错 → 第 4 天；有错 → 第 2 天
    function enterReviewPool() {
      const today = dateKey(getToday());
      const firstWrong = state.stageWrong.s1 + state.stageWrong.s2;
      const firstDays = firstWrong > 0 ? SRS_INTERVALS[0] : SRS_INTERVALS[1];
      const node = firstWrong > 0 ? 0 : 1;
      sessionWordIds().forEach((wordId) => {
        if (!state.reviewPool[wordId]) {
          state.reviewPool[wordId] = {
            node,
            anchor: today,
            due: addDaysKey(today, firstDays),
            mastered: false,
            lastReviewed: ""
          };
        }
      });
    }

    // 复习判分：只在两轮认词结束后调用一次；写/说不走这里
    function answerReview(wordId, correct) {
      const entry = state.reviewPool[wordId];
      if (!entry) return { ok: correct, text: "这个词还没有进入复习池。" };

      const today = dateKey(getToday());
      const node = entry.node;
      entry.lastReviewed = today;
      let text = "";

      if (correct) {
        if (node >= SRS_INTERVALS.length - 1) {
          entry.mastered = true;
          entry.node = node;
          entry.due = "";
          text = "第 50 天节点通过，这个词已掌握。";
        } else {
          entry.node = node + 1;
          entry.due = addDaysKey(entry.anchor, SRS_INTERVALS[entry.node]);
          text = `进入第 ${SRS_INTERVALS[entry.node]} 天节点，下次复习 ${entry.due}。`;
        }
      } else if (node === 0) {
        // 第 2 天节点答错：节点不变，明天再考
        entry.anchor = today;
        entry.due = addDaysKey(today, 1);
        text = "第 2 天节点答错，明天再考它一次，节点不变。";
      } else {
        // 第 4 天及以后答错：进度归零
        entry.node = 0;
        entry.anchor = today;
        entry.due = addDaysKey(today, SRS_INTERVALS[0]);
        text = `已归零，${SRS_INTERVALS[0]} 天后重新开始（${entry.due}）。`;
      }

      state.srsHistory.push({ date: today, word: wordId, node, correct });
      if (state.srsHistory.length > 200) {
        state.srsHistory = state.srsHistory.slice(-200);
      }
      saveState();
      return { ok: correct, text };
    }

    // ============================================================
    // 6. 冷却 / 阶段推进 / 计时
    // ============================================================
    function markAnswered(wordId) {
      state.answerSeq += 1;
      state.lastSeen[wordId] = state.answerSeq;
      // 本次作答后，该词必须等 3–7 个其他词的作答才可再次被抽到
      const gap = COOL_MIN + Math.floor(Math.random() * (COOL_MAX - COOL_MIN + 1));
      state.cooldownUntil[wordId] = state.answerSeq + 1 + gap;
    }

    function isCool(wordId) {
      const until = state.cooldownUntil[wordId];
      return typeof until !== "number" || state.answerSeq >= until;
    }

    // 严格优先选冷却已满的词；不足时退化为“最久没出现”，不会死锁
    function pickCoolWord(pool) {
      const list = (Array.isArray(pool) ? pool : []).filter((id) => getWord(id));
      if (!list.length) return null;
      const ready = list.filter(isCool);
      if (ready.length) return randomOf(ready);
      return list.slice().sort((a, b) => (state.lastSeen[a] || -999) - (state.lastSeen[b] || -999))[0];
    }

    function todayRemaining() {
      if (state.stage === "stage1") return state.queue.length;
      if (state.stage === "stage2") return state.stage2Queue.length;
      if (state.stage === "stage2b") return state.stage2bQueue.length;
      if (state.stage === "write") return Math.max(0, sessionWordCount() - state.writeDone.length);
      if (state.stage === "speak") return Math.max(0, sessionWordCount() - state.speakDone.length);
      return 0;
    }

    // 学习阶段顺序：认词 → 中→英 → 英→中 → 说 → 写
    const LEARN_STAGES = ["stage1", "stage2", "stage2b", "speak", "write"];

    function learnDoneList(stage) {
      if (stage === "stage1") return state.stage1Done;
      if (stage === "stage2") return state.stage2Done;
      if (stage === "stage2b") return state.stage2bDone;
      if (stage === "speak") return state.speakDone;
      return state.writeDone;
    }

    // 某个阶段还差哪些词
    function learnPending(stage) {
      const done = learnDoneList(stage);
      return sessionWordIds().filter((id) => !done.includes(id));
    }

    // 阶段是否已全员通过
    function learnStageComplete(stage) {
      const ids = sessionWordIds();
      return ids.length > 0 && ids.every((id) => learnDoneList(stage).includes(id));
    }

    // 按“每个词自己的进度”决定当前停在哪个阶段；done 列表是唯一判定依据。
    // 某词答错被从后续 done 列表移除后，会自动回到最早未通过的阶段重走完整轮次。
    function syncLearnStage() {
      const ids = sessionWordIds();
      if (!ids.length) return state.stage;
      let active = null;
      for (const stage of LEARN_STAGES) {
        if (!learnStageComplete(stage)) { active = stage; break; }
      }
      if (!active) {
        if (state.stage !== "done") finishToday();
        return state.stage;
      }
      state.stage = active;
      const pending = learnPending(active);
      state.queue = active === "stage1" ? pending : [];
      state.stage2Queue = active === "stage2" ? pending : [];
      state.stage2bQueue = active === "stage2b" ? pending : [];
      state.speakQueue = active === "speak" ? pending : [];
      state.writeQueue = active === "write" ? pending : [];
      return active;
    }

    // 非写阶段答错：清空该词在后续阶段的通过记录，让它从认词重新走一遍
    function resetWordToStage1(wordId) {
      [state.stage1Done, state.stage2Done, state.stage2bDone, state.speakDone, state.writeDone].forEach((list) => {
        const index = list.indexOf(wordId);
        if (index >= 0) list.splice(index, 1);
      });
    }

    function formatDuration(ms) {
      if (typeof ms !== "number" || !isFinite(ms) || ms < 0) return "不计时";
      const total = Math.floor(ms / 1000);
      return `${String(Math.floor(total / 60)).padStart(2, "0")}:${String(total % 60).padStart(2, "0")}`;
    }

    function learnEncouragement(summary) {
      const w = summary.wrong;
      const total = summary.totalWrong;
      if (total === 0) return `五个阶段一次全过，${summary.words} 个词零失误，今天的节奏非常稳。`;
      if (w.s3 + w.s4 > 0) {
        return `写和说一共错了 ${w.s3 + w.s4} 次才全过，但每个词最后都拿下了，这份坚持会记在脑子里。`;
      }
      if (w.s2 + w.s2b > 0) {
        return `中→英和英→中一共错了 ${w.s2 + w.s2b} 次，说明意思记住了、拼写和辨形还在磨合；下一轮复习会把这条线接上。`;
      }
      return `认词错了 ${w.s1} 次，但 ${summary.words} 个词最后全认对了，先把意思钉牢，后面会越来越快。`;
    }

    function buildLearnSummary() {
      const wrong = normalizeWrongCounts(state.stageWrong);
      const durationMs = !state.learnStartedMs
        ? null
        : Math.max(0, Date.now() - state.learnStartedMs);
      const next = getNextReview();
      const summary = {
        date: dateKey(getToday()),
        durationMs,
        words: sessionWordCount(),
        wrong,
        totalWrong: wrong.s1 + wrong.s2 + wrong.s2b + wrong.s3 + wrong.s4,
        nextDue: next ? next.due : "",
        encouragement: ""
      };
      summary.encouragement = learnEncouragement(summary);
      return summary;
    }

    // 当天的“已完成组数 / 累计词数”，跨日自动归零
    function syncGroupStatsDate() {
      const today = dateKey(getToday());
      if (state.groupStatsDate === today) return;
      state.groupStatsDate = today;
      state.groupsToday = 0;
      state.wordsToday = 0;
    }

    function finishToday() {
      const today = dateKey(getToday());
      if (state.stage === "done" && state.todayDoneAt === today) return;
      state.stage = "done";
      state.speakQueue = [];
      state.speakDone = sessionWordIds();
      state.stage2bQueue = [];
      state.stage2bDone = sessionWordIds();
      state.todayDoneAt = today;
      // 记入“已学过”，预习只展示尚未学过的下一批
      state.learnedEver = [...new Set([...state.learnedEver, ...sessionWordIds()])];
      // 当天累计：完成一组就 +1 组，词数按本组实际通过数累计（刷新后不丢）
      syncGroupStatsDate();
      state.groupsToday += 1;
      state.wordsToday += sessionWordIds().length;
      enterReviewPool();
      state.learnSummary = buildLearnSummary();
      saveState();
      // 整组词全部通过（不是答错重来的中间态）才弹一次鼓励
      showEncouragement();
    }

    // 完成页“再学一组”：立刻抽下一组并进入认词；不设上限
    function startNextGroup() {
      if (availableLearnIds().length < MIN_LEARN_BATCH) {
        showToast("词书里的词已经学完了");
        return;
      }
      resetLearnSession();
      ensureLearnSession();
      saveState();
      renderAll();
      showView("study");
    }

    // 从“已备内容”里抽当日队列：随机打乱，并尽量拉开原书相邻词
    function availableLearnIds() {
      const inSession = new Set(state.learnWords || []);
      return preparedOrderIds().filter((id) => !state.learnedEver.includes(id) && !inSession.has(id));
    }

    // 词条在原书中的位置，用于判断两个词是否相邻
    function entryOrderIndex(wordId) {
      const hit = (bookInfo.entries || []).find((entry) => entry.word === wordId);
      if (hit && typeof hit.index === "number") return hit.index;
      const pos = preparedEntries.findIndex((item) => item.word === wordId);
      return pos >= 0 ? pos : 9999;
    }

    // 随机洗牌后挑选“相邻原书序号差”最大的一种排法，尽量把相邻词拉开
    function shuffleSpread(ids) {
      const list = ids.slice();
      if (list.length < 3) return shuffle(list);
      const order = new Map(list.map((id) => [id, entryOrderIndex(id)]));
      const minGap = (arr) => arr.reduce((gap, id, index) => {
        if (!index) return gap;
        return Math.min(gap, Math.abs(order.get(id) - order.get(arr[index - 1])));
      }, Infinity);
      let best = shuffle(list);
      let bestGap = minGap(best);
      for (let i = 0; i < 40 && bestGap <= 1; i += 1) {
        const candidate = shuffle(list);
        const gap = minGap(candidate);
        if (gap > bestGap) {
          best = candidate;
          bestGap = gap;
        }
      }
      return best;
    }

    // 下一批预抽：当天抽好即固定，刷新不重排；数量跟随每天词数
    function ensurePreviewBatch() {
      const today = dateKey(getToday());
      const available = availableLearnIds();
      const wanted = Math.min(state.dailyTarget || 10, available.length);
      const cached = Array.isArray(state.previewBatch)
        ? state.previewBatch.filter((id) => available.includes(id))
        : [];
      if (state.previewBatchDate === today && wanted > 0 && cached.length >= wanted) {
        return cached.slice(0, wanted);
      }
      if (available.length < MIN_LEARN_BATCH) {
        if (state.previewBatch.length || state.previewBatchDate !== today) {
          state.previewBatch = [];
          state.previewBatchDate = today;
          saveState();
        }
        return [];
      }
      state.previewBatch = shuffleSpread(available).slice(0, wanted);
      state.previewBatchDate = today;
      saveState();
      return state.previewBatch.slice();
    }

    // 进入新学前抽取当日队列；优先使用预抽好的下一批，保证预习看到的就是今天要学的
    function ensureLearnSession() {
      if (state.stage !== "stage1" || state.learnWords.length || state.stage1Done.length) return;
      const available = availableLearnIds();
      if (available.length < MIN_LEARN_BATCH) return; // 不足 10 个，页面显示“需要补充词条”
      const wanted = Math.min(state.dailyTarget || 10, available.length);
      const preview = ensurePreviewBatch();
      const batch = preview.length >= wanted
        ? preview
        : shuffleSpread(available).slice(0, wanted);
      // 抽取顺序与展开顺序各打乱一次，同一批内不会重复
      state.learnWords = shuffle([...new Set(batch)]);
      state.queue = shuffle(state.learnWords);
      state.previewBatch = [];
      state.previewBatchDate = "";
      state.introSeen = [];
      state.stageWrong = { s1: 0, s2: 0, s2b: 0, s3: 0, s4: 0 };
      state.learnStartedMs = Date.now();
      state.todayDoneAt = "";
      saveState();
      // 后台预取本组词的深度批次，后面的认词/答题只需等当前这个词
      state.learnWords.forEach((id) => ensureDeep(id));
    }

    // 清空当日新学队列（跨日或切换词书时使用），保留已学记录与复习池
    function resetLearnSession() {
      state.stage = "stage1";
      state.queue = [];
      state.learnWords = [];
      state.previewBatch = [];
      state.previewBatchDate = "";
      state.stage1Done = [];
      state.stage2Queue = [];
      state.stage2Done = [];
      state.stage2bQueue = [];
      state.stage2bDone = [];
      state.writeQueue = [];
      state.writeDone = [];
      state.speakQueue = [];
      state.speakDone = [];
      state.introSeen = [];
      state.stageWrong = { s1: 0, s2: 0, s2b: 0, s3: 0, s4: 0 };
      state.learnSummary = null;
      state.learnStartedMs = 0;
      state.todayDoneAt = "";
    }

    function rolloverLearnDay() {
      const today = dateKey(getToday());
      if (state.stage !== "done" || state.todayDoneAt === today) return;
      resetLearnSession();
      saveState();
    }

    // 已备内容按书序排列的词 id
    // 整本词书的词 id，按词书顺序（词书缺失时用深度索引的批次顺序兜底）
    function preparedOrderIds() {
      if (words.length) return words.map((item) => item.word).filter(Boolean);
      const order = new Map();
      (bookInfo.entries || []).forEach((entry) => order.set(entry.word, entry.index));
      return preparedEntries
        .map((item) => item.word)
        .sort((a, b) => (order.get(a) || 9999) - (order.get(b) || 9999));
    }

    // ============================================================
    // 7. 出题：看英文选中文 / 看中文选英文
    // ============================================================
    function pickSenseFor(wordItem) {
      const senses = Array.isArray(wordItem && wordItem.senses) ? wordItem.senses : [];
      const chunks = String((wordItem && wordItem.definition_zh) || "")
        .split(/[；;、，,]/)
        .map((item) => item.trim())
        .filter(Boolean);
      const matched = senses.find((sense) => chunks.some((chunk) => String(sense.titleCN || "").includes(chunk)));
      // 义项缺失时也给出一张可渲染的空义项，速览卡不抛错
      return matched || senses[0] || { no: "—", title: "", titleCN: "", definition: "", definitionCN: "", example: "", exampleCN: "" };
    }

    function sceneNote(wordItem) {
      return wordItem.sceneCN || wordItem.sceneNote || "";
    }

    // 场景字段里前面可能有中文情境，说阶段只取英文句子
    function sceneSentence(wordItem) {
      const scene = String(wordItem.scene || "");
      const index = scene.search(/[A-Za-z]/);
      return index >= 0 ? scene.slice(index).trim() : scene;
    }

    // 阶段 3 只给中文提示：把 sceneCN 里的英文词换成“这个词”
    function sceneHintCN(wordItem) {
      const note = sceneNote(wordItem);
      if (!note) return "";
      const forms = [wordItem.word, `${wordItem.word}s`, `${wordItem.word}ed`, `${wordItem.word}ing`, `${wordItem.word}d`];
      let out = note;
      forms.forEach((form) => {
        out = out.replace(new RegExp(`\\b${escapeRegExp(form)}\\b`, "gi"), "这个词");
      });
      return out;
    }

    // 没有专属场景图的词也给一个中性的内联示意图，保证速览卡/预习/词库都能看到场景区

    function sceneArtHTML(wordId) {
      const art = SCENE_ART[wordId];
      if (art) {
        return `<figure class="scene-art">
          ${art.svg}
          <figcaption>${esc(art.caption)}</figcaption>

    function makeOptions(correct, pool, need) {
      const picked = [];
      const seen = new Set([correct]);
      pool.forEach((value) => {
        if (picked.length < need && !seen.has(value)) {
          seen.add(value);
          picked.push(value);
        }
      });
      return shuffle([correct, ...picked]);
    }

    // 拼写相似度：用来判断哪个干扰词组与目标词更接近
    function spellingScore(a, b) {
      let prefix = 0;
      const len = Math.min(a.length, b.length);
      while (prefix < len && a[prefix].toLowerCase() === b[prefix].toLowerCase()) prefix += 1;
      return prefix * 3 + (a[0] === b[0] ? 2 : 0) + (Math.abs(a.length - b.length) <= 2 ? 1 : 0);
    }

    // 干扰项只来自独立干扰词池，严禁使用今日正在学的队列词
    function pickDistractors(wordItem, type) {
      const answer = type === "meaning" ? wordItem.definition_zh : wordItem.word;
      const excludedWords = new Set([wordItem.word, ...(state.learnWords || [])]);
      const due = state.reviewSession && Array.isArray(state.reviewSession.due) ? state.reviewSession.due : [];
      due.forEach((id) => excludedWords.add(id));

      const rankedGroups = distractorGroups.map((group) => ({
        group,
        score: Math.max(...group.words.map((entry) => spellingScore(wordItem.word, entry.word)), 0)
      })).sort((a, b) => b.score - a.score);

      const picked = [];
      const seen = new Set([answer]);
      const take = (group) => {
        group.words.forEach((entry) => {
          if (picked.length >= 3) return;
          if (excludedWords.has(entry.word)) return;
          const value = type === "meaning" ? entry.zh : entry.word;
          if (!value || seen.has(value)) return;
          seen.add(value);
          picked.push(value);
        });
      };
      rankedGroups.forEach(({ group }) => {
        if (picked.length >= 3) return;
        take(group);
      });
      // 兜底池：文件缺失或解析失败时仍能凑够三个干扰项
      if (picked.length < 3) DISTRACTOR_FALLBACK.groups.forEach(take);
      // 极端情况下也不能让选项少于四个
      const fillers = type === "meaning" ? ["另一个意思", "再一个意思", "第三个意思"] : ["another", "otherword", "thirdword"];
      fillers.forEach((value) => {
        if (picked.length < 3 && !seen.has(value)) {
          seen.add(value);
          picked.push(value);
        }
      });
      return picked.slice(0, 3);
    }

    function optionsHTML(values, opts = {}) {
      const answer = opts.answer;
      const chosen = opts.chosen;
      const answered = Boolean(opts.answered);
      return `<div class="options">${values.map((value, index) => {
        const classes = ["option"];
        if (!answered && index === 0) classes.push("is-highlight");
        if (answered && answer === value) classes.push("is-correct");
        else if (answered && chosen === value) classes.push("is-wrong");
        return `<button type="button" class="${classes.join(" ")}" data-value="${esc(value)}" data-index="${index}" ${answered ? "disabled" : ""}>${esc(value)}</button>`;
      }).join("")}
      </div>`;
    }

    function buildMeaningQuestion(wordItem) {
      return {
        type: "meaning",
        answer: wordItem.definition_zh,
        values: makeOptions(wordItem.definition_zh, pickDistractors(wordItem, "meaning"), 3),
        promptHTML: `
          <p class="quiz-word">${esc(wordItem.word)}</p>
          <div class="quiz-audio">${speakBtn(wordItem.word, "en-US", "🔊 AI 朗读")}</div>`
      };
    }

    function buildWordQuestion(wordItem) {
      return {
        type: "word",
        answer: wordItem.word,
        values: makeOptions(wordItem.word, pickDistractors(wordItem, "word"), 3),
        promptHTML: `<p class="quiz-def">${esc(wordItem.definition_zh)}</p>`
      };
    }

    function answerInfoHTML(wordItem, sense, note) {

    function feedbackHTML(opts) {

          <div class="undo-row">

    function undoBarHTML() {
      if (!undoSnapshot) return "";

    function fullCardHTML(wordItem) {
      const wrap = document.createElement("div");
      wrap.className = "intro-full-card";
      wrap.appendChild(renderCard(wordItem));
      // 保留外层容器，让 .intro-full-card 的样式（间距）生效
      return wrap.outerHTML;

    // ============================================================
    // 8. 新学：阶段 1 认词 / 阶段 2 中→英 / 阶段 3 英→中
    // ============================================================
    let current = null;      // 新学阶段 1/2/3 + 复习所有阶段
    let writeCurrent = null; // 新学写阶段
    let speakCurrent = null; // 新学说阶段
    let undoSnapshot = null; // 只保留一份：上一次作答前
    let undoUsed = false;

    function pickLearnCurrent() {
      if (state.stage === "stage1") {
        // 认词关每个词只过一遍：确认过的词立刻移出候选，所以不会连着抽到同一个词
        const pending = learnPending("stage1");
        if (!pending.length) return null;
        const wordId = randomOf(pending);
        return { kind: "learn", stage: "stage1", wordId, answered: false, question: null, sense: pickSenseFor(getWord(wordId)) };
      }
      if (state.stage === "stage2") {
        const wordId = pickCoolWord(state.stage2Queue);
        if (!wordId) return null;
        return { kind: "learn", stage: "stage2", wordId, answered: false, introDone: true, question: null, sense: pickSenseFor(getWord(wordId)) };
      }
      if (state.stage === "stage2b") {
        const wordId = pickCoolWord(state.stage2bQueue);
        if (!wordId) return null;
        return { kind: "learn", stage: "stage2b", wordId, answered: false, introDone: true, question: null, sense: pickSenseFor(getWord(wordId)) };
      }
      return null;
    }

    function renderStudyView() {
      syncLearnStage();
      if (state.stage === "done" && !(speakCurrent && speakCurrent.submitted) && !(writeCurrent && writeCurrent.submitted)) {
        renderStageDone();
        return;
      }
      if (speakCurrent && speakCurrent.submitted) { renderSpeak(); return; }
      if (writeCurrent && writeCurrent.submitted) { renderWrite(); return; }
      if (state.stage === "speak") { renderSpeak(); return; }
      if (state.stage === "write") { renderWrite(); return; }
      renderRecognize();
    }

    function studyHeadHTML(pill, items) {
      return `
        <div class="study-head">
          <span class="pill">${esc(pill)}</span>
          ${items.map((item) => `<span class="head-item">${item}</span>`).join("")}

    }

    function renderRecognize() {
      // 作答后等待确认时不要换题：答错回退阶段后仍要先展示这张速览卡
      if (!current || current.kind !== "learn" || (!current.answered && current.stage !== state.stage)) current = pickLearnCurrent();

      if (!current) {
        syncLearnStage();
        if (state.stage === "done") { renderStageDone(); return; }
        if (state.stage === "speak") { renderSpeak(); return; }
        if (state.stage === "write") { renderWrite(); return; }
        current = pickLearnCurrent();
        if (!current) { renderStageDone(); return; }
      }

      // 深度内容按需加载：未就绪时先显示占位，批次到达后重建题目与速览卡
      if (!deepReady(current.wordId)) {
        holdForDeep(current.wordId, "view-study", () => {
          if (current) {
            current.sense = pickSenseFor(getWord(current.wordId));
            current.question = null;
          }
          renderStudyView();
          renderStats();
        });
        return;
      }

      const wordItem = getWord(current.wordId);
      const stage1 = current.stage === "stage1";
      const stage2b = current.stage === "stage2b";
      const stageName = stage1 ? "阶段 1 · 认词" : stage2b ? "阶段 3 · 英→中" : "阶段 2 · 中→英";
      const queueLen = stage1 ? state.queue.length : stage2b ? state.stage2bQueue.length : state.stage2Queue.length;
      const doneLen = stage1 ? state.stage1Done.length : stage2b ? state.stage2bDone.length : state.stage2Done.length;
      const queueLabel = stage1 ? "待认词" : stage2b ? "待英→中" : "待中→英";

      // 认词关：每个词只出现一次——完整词条看一遍、点按钮确认，随即换下一个词
      if (stage1) {
        document.getElementById("view-study").innerHTML = `
          <section class="study-card">
            ${studyHeadHTML("阶段 1 · 认词", [
              `待认词 <b>${learnPending("stage1").length}</b>`,
              `已确认 <b>${state.stage1Done.length} / ${sessionWordCount()}</b>`
            ])}
            <div class="quiz-body">
              <p class="quiz-progress">认词 · 先看完整词条</p>
              <p class="quiz-tip">每个词只过一遍：看完下面的释义后点按钮确认，接着看下一个词；十个词都过完，进入「看中选英」。</p>
              ${fullCardHTML(wordItem)}
              <button type="button" class="btn-primary intro-btn" data-intro-done>看完，认识这个词</button>
            </div>
          </section>`;
        return;
      }

      if (!current.question) {
        current.question = stage1 || stage2b ? buildMeaningQuestion(wordItem) : buildWordQuestion(wordItem);
      }
      const q = current.question;

      document.getElementById("view-study").innerHTML = `
        <section class="study-card">
          ${studyHeadHTML(stageName, [
            `${queueLabel} <b>${queueLen}</b>`,
            `已通过 <b>${doneLen} / ${sessionWordCount()}</b>`,
            `今天答错 <b>${todayWrongCount()}</b> 次`
          ])}
          <div class="quiz-body">
            <p class="quiz-progress">${stage1 ? "看英文选中文" : stage2b ? "再看一次：看英文选中文" : "看中文选英文"} · 答对就通过本阶段</p>
            <p class="quiz-tip">阶段已通过但仍在与其他词穿插 · 同一词至少隔 3–7 个其他词才会再出现</p>
            <div class="quiz-prompt">${q.promptHTML}</div>
            ${optionsHTML(q.values, { answer: q.answer, chosen: current.chosen, answered: current.answered })}
            ${current.answered
              ? feedbackHTML({ ok: current.correct, wordItem, sense: current.sense, extra: current.feedbackExtra, nextKind: "learn" })
              : undoBarHTML()}
          </div>
        </section>`;
    }

    function answerLearnOption(correct, chosen) {
      const wordItem = getWord(current.wordId);
      const wordId = current.wordId;
      const stageKey = current.stage;
      const key = stageKey === "stage1" ? "s1" : stageKey === "stage2b" ? "s2b" : "s2";
      markAnswered(wordId);
      let extra = "";

      if (correct) {
        const done = learnDoneList(stageKey);
        if (!done.includes(wordId)) done.push(wordId);
        if (stageKey === "stage1" && learnStageComplete("stage1")) {
          extra = "阶段 1 全部通过，点「下一题」进入中→英。";
        } else if (stageKey === "stage2" && learnStageComplete("stage2")) {
          extra = "阶段 2 全部通过，点「下一题」进入英→中。";
        } else if (stageKey === "stage2b" && learnStageComplete("stage2b")) {
          extra = "阶段 3 全部通过，点「下一题」进入说。";
        }
      } else {
        bumpStageWrong(key);
        bumpWrong();
        // 写阶段以外的答错：清空该词后续阶段的通过记录，退回认词重走完整轮次
        resetWordToStage1(wordId);
        extra = stageKey === "stage1"
          ? "这个词会在 3–7 个其他词之后重新出现。"
          : "这个词已退回认词，重新走完整轮次；先隔 3–7 个其他词再出现。";
      }

      current.answered = true;
      current.correct = correct;
      current.chosen = chosen;
      current.feedbackExtra = extra;
      saveState();
    }

    // ============================================================
    // 9. 新学：阶段 3 写
    // ============================================================
    function renderWrite() {
      if (!writeCurrent) {
        let wordId = pickCoolWord(state.writeQueue);
        if (!wordId) {
          state.writeQueue = learnPending("write");
          wordId = pickCoolWord(state.writeQueue);
        }
        if (!wordId) {
          syncLearnStage();
          if (state.stage === "done") { renderStageDone(); return; }
          if (state.stage !== "write") { renderStudyView(); return; }

          submitted: false,
          correct: false,

          sense: pickSenseFor(getWord(wordId))
        };
      }

      if (!deepReady(writeCurrent.wordId)) {
        holdForDeep(writeCurrent.wordId, "view-study", () => {

          renderStudyView();
          renderStats();

      const submitted = writeCurrent.submitted;

      document.getElementById("view-study").innerHTML = `
