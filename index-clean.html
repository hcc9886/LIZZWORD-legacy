            </div>
            <p class="quiz-tip" id="writeHint">忽略大小写、首尾空格和结尾标点；回车也能提交。</p>
            ${submitted
              ? feedbackHTML({
                  ok: writeCurrent.correct,
                  wordItem,
                  sense: writeCurrent.sense,
                  note: sceneNote(wordItem),
                  extra: writeCurrent.correct
                    ? (writeCurrent.finished ? "写阶段完成，点「确认」查看完成页。" : "")
                    : "写阶段只纠正不重置；已排到写队列末尾，3–7 个其他词之后再出现。",
                  nextKind: "write",
                  nextLabel: writeCurrent.finished ? "确认，查看完成页" : "确认，下一个"
                })
              : undoBarHTML()}
          </div>
        </section>`;
    }

    function submitWrite() {
      if (!writeCurrent || writeCurrent.submitted) return;
      const input = document.getElementById("writeInput");
      if (!input) return;
      const raw = input.value;
      if (!raw.trim()) {
        const hint = document.getElementById("writeHint");
        if (hint) hint.textContent = "先输入一个英文单词再提交。";
        return;
      }

      writeCurrent.input = raw;
      takeUndoSnapshot();

      const wordItem = getWord(writeCurrent.wordId);
      const wordId = writeCurrent.wordId;
      const correct = normalizeWord(raw) === normalizeWord(wordItem.word);

      markAnswered(wordId);
      writeCurrent.submitted = true;
      writeCurrent.correct = correct;

      if (correct) {
        state.writeQueue = state.writeQueue.filter((id) => id !== wordId);
        if (!state.writeDone.includes(wordId)) state.writeDone.push(wordId);
        if (state.writeDone.length >= sessionWordCount()) writeCurrent.finished = true;
      } else {
        bumpStageWrong("s3");
        bumpWrong();
        state.writeQueue = state.writeQueue.filter((id) => id !== wordId);
        state.writeQueue.push(wordId);
      }

      saveState();
      renderStudyView();
      renderStats();
    }

    // ============================================================
    // 10. 新学：阶段 4 说
    // ============================================================
    let speakFallback = !SpeechRecognitionCtor || location.protocol === "file:";
    let speakNoticeShown = false;

    function fallbackNoticeHTML() {
      if (!speakFallback || speakNoticeShown) return "";
      speakNoticeShown = true;
      return `<div class="notice">
        双击打开时浏览器禁用麦克风，已自动切到自评模式；用本地服务打开可自动判分。
        在本目录运行 <code>python3 -m http.server</code>，再访问 <code>http://localhost:8000</code>。
      </div>`;
    }

    function speechAskHTML(target) {
      if (target.submitted) return "";
      if (speakFallback) {
        return `
          <div class="speak-box">
            <p class="quiz-tip">自评模式：先在心里读一遍，再如实选择。</p>
            <div class="btn-row">
              <button type="button" class="btn-primary" data-speak-judge="ok">我读对了</button>
              <button type="button" class="btn-ghost" data-speak-judge="no">我没读对</button>
            </div>
          </div>`;
      }
      return `
        <div class="speak-box">
          <button type="button" class="btn-primary" data-speech="start">🎤 开始朗读</button>
          <p class="quiz-tip">允许麦克风后读出 ____ 处的词，只取第一次识别结果。</p>
          ${target.retryMessage ? `<p class="speak-status">${esc(target.retryMessage)}</p>` : ""}
          <button type="button" class="btn-ghost" data-speech="fallback">改用自评模式</button>
        </div>`;
    }

    function speakHintHTML(target, wordItem, scope) {
      if (!target.hintOpen) {
        return `<button type="button" class="btn-ghost hint-btn" data-hint-toggle>看一眼提示</button>`;
      }
      return `
        <div class="speak-hint">
          <p class="speak-hint-word">答案：${esc(wordItem.word)} <span class="ipa">${esc(wordItem.ipa_uk)}</span> ${speakBtn(wordItem.word, "en-US", "🔊 AI 朗读")}</p>
          <button type="button" class="btn-ghost hint-btn" data-hint-toggle data-scope="${scope}">隐藏提示</button>
        </div>`;
    }

    function renderSpeak() {
      if (!speakCurrent) {
        let wordId = pickCoolWord(state.speakQueue);
        if (!wordId) {
          state.speakQueue = learnPending("speak");
          wordId = pickCoolWord(state.speakQueue);
        }
        if (!wordId) {
          syncLearnStage();
          if (state.stage === "done") { renderStageDone(); return; }
          if (state.stage !== "speak") { renderStudyView(); return; }
          return;
        }
        const wordItem = getWord(wordId);
        speakCurrent = {
          wordId,
          submitted: false,
          correct: false,
          transcript: "",
          errorCount: 0,
          retryMessage: "",
          hintOpen: false,
          sense: pickSenseFor(wordItem),
          blank: buildSpeakBlank(sceneSentence(wordItem), wordItem.word)
        };
      }

      if (!deepReady(speakCurrent.wordId)) {
        holdForDeep(speakCurrent.wordId, "view-study", () => {
          if (speakCurrent) {
            const deepItem = getWord(speakCurrent.wordId);
            speakCurrent.sense = pickSenseFor(deepItem);
            speakCurrent.blank = buildSpeakBlank(sceneSentence(deepItem), deepItem.word);
          }
          renderStudyView();
          renderStats();
        });
        return;
      }

      const wordItem = getWord(speakCurrent.wordId);
      const submitted = speakCurrent.submitted;

      document.getElementById("view-study").innerHTML = `
        <section class="study-card">
          ${studyHeadHTML("阶段 4 · 说", [
            `说队列剩余 <b>${state.speakQueue.length}</b>`,
            `已通过 <b>${state.speakDone.length} / ${sessionWordCount()}</b>`,
            `今天答错 <b>${todayWrongCount()}</b> 次`
          ])}
          ${fallbackNoticeHTML()}
          <div class="quiz-body">
            <p class="quiz-progress">看场景把空读出来 · 题面不出现答案单词</p>
            <div class="quiz-prompt">
              ${sceneArtHTML(speakCurrent.wordId)}
              <p class="quiz-scene">${esc(speakCurrent.blank.text)}</p>
            </div>
            ${submitted ? "" : speakHintHTML(speakCurrent, wordItem, "study")}
            ${speechAskHTML(speakCurrent)}
            ${submitted
              ? feedbackHTML({
                  ok: speakCurrent.correct,
                  wordItem,
                  sense: speakCurrent.sense,
                  note: sceneNote(wordItem),
                  extra: speakCurrent.correct
                    ? (learnStageComplete("speak") ? "说阶段完成，点「确认」进入写。" : "")
                    : "这个词已退回认词，重新走完整轮次；先隔 3–7 个其他词再出现。",
                  nextKind: "speak",
                  nextLabel: "确认，下一个"
                })
              : undoBarHTML()}
          </div>
        </section>`;
    }

    function speechTarget() {
      if (viewMode === "review" && current && current.phase === "speak") return current;
      return speakCurrent;
    }

    function rerenderQuiz() {
      if (viewMode === "review") renderReviewView();
      else renderStudyView();
      renderStats();
    }

    function startSpeech() {
      if (!SpeechRecognitionCtor) {
        speakFallback = true;
        rerenderQuiz();
        return;
      }
      const target = speechTarget();
      if (!target || target.submitted) return;

      const recognizer = new SpeechRecognitionCtor();
      recognizer.lang = "en-US";
      recognizer.interimResults = false;
      recognizer.maxAlternatives = 1;

      recognizer.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        if (!target || target.submitted) return;
        target.transcript = transcript;
        const wordItem = getWord(target.wordId);
        const said = normalizeSpeech(transcript);
        const correct = matchesWord(said, wordItem.word) || (target.blank && matchesWord(said, target.blank.form));
        finishSpeechAnswer(correct);
      };

      recognizer.onerror = (event) => {
        if (!target || target.submitted) return;
        const error = event.error || "";
        // 技术错误不算答错：麦克风不可用就降级，没听清就提示重试
        if (error === "not-allowed" || error === "service-not-allowed" || error === "audio-capture") {
          speakFallback = true;
          target.retryMessage = "";
          rerenderQuiz();
          return;
        }
        if (error === "no-speech") {
          target.errorCount += 1;
          if (target.errorCount >= 2) {
            speakFallback = true;
            target.retryMessage = "";
          } else {
            target.retryMessage = "没有听到声音，请再点一次「开始朗读」。";
          }
          rerenderQuiz();
          return;
        }
        target.retryMessage = "识别没有成功，请重试（这次不计入答错）。";
        rerenderQuiz();
      };

      try {
        recognizer.start();
      } catch (error) {
        speakFallback = true;
        rerenderQuiz();
      }
    }

    function finishSpeechAnswer(correct) {
      if (viewMode === "review") {
        finishReviewSpeak(correct);
        return;
      }
      finishLearnSpeak(correct);
    }

    function finishLearnSpeak(correct) {
      if (!speakCurrent || speakCurrent.submitted) return;
      takeUndoSnapshot();
      const wordItem = getWord(speakCurrent.wordId);
      const wordId = speakCurrent.wordId;
      speakCurrent.submitted = true;
      speakCurrent.correct = correct;
      markAnswered(wordId);

      if (correct) {
        if (!state.speakDone.includes(wordId)) state.speakDone.push(wordId);
      } else {
        // 说答错：清回第一阶段，重新走完整轮次
        bumpStageWrong("s4");
        bumpWrong();
        resetWordToStage1(wordId);
      }

      saveState();
      renderStudyView();
      renderStats();
    }

    // ============================================================
    // 11. 复习：两轮认词 + 写 + 说
    // ============================================================
    function ensureReviewSession() {
      const today = dateKey(getToday());
      const existing = state.reviewSession;
      if (existing && existing.date === today) return existing;

      const due = getDueWords();
      if (!due.length) return null;
      const session = {
        date: today,
        startMs: Date.now(),
        due: due.slice(),
        recallQueue: shuffle(due),
        recallPassed: [],
        recallWrong: 0,
        recallDone: false,
        r1: shuffle(due),
        r1Passed: [],
        r2: [],
        r2Passed: [],
        writeQueue: [],
        writeDone: [],
        speakQueue: [],
        speakDone: [],
        hadWrong: {},
        graded: [],
        correctCount: 0,
        wrongCount: 0,
        summary: null
      };
      state.reviewSession = session;
      saveState();
      return session;
    }

    function reviewPhase(session) {
      if (!session || session.due.length === 0) return "done";
      if (!session.recallDone) return "recall";
      if (session.r1Passed.length < session.due.length) return "r1";
      if (session.r2Passed.length < session.due.length) return "r2";
      if (session.writeDone.length < session.due.length) return "write";
      if (session.speakDone.length < session.due.length) return "speak";
      return "done";
    }

    function ensureReviewQueues(session, phase) {
      const due = session.due.filter((id) => getWord(id));
      if (phase === "recall" && session.recallQueue.length === 0 && session.recallPassed.length < session.due.length) {
        session.recallQueue = shuffle(due.filter((id) => !session.recallPassed.includes(id)));
      }
      if (phase === "r1" && session.r1.length === 0 && session.r1Passed.length < session.due.length) {
        session.r1 = shuffle(due.filter((id) => !session.r1Passed.includes(id)));
      }
      if (phase === "r2" && session.r2.length === 0 && session.r2Passed.length < session.due.length) {
        session.r2 = shuffle(due.filter((id) => !session.r2Passed.includes(id)));
      }
      if (phase === "write" && session.writeQueue.length === 0 && session.writeDone.length < session.due.length) {
        session.writeQueue = shuffle(due.filter((id) => !session.writeDone.includes(id)));
      }
      if (phase === "speak" && session.speakQueue.length === 0 && session.speakDone.length < session.due.length) {
        session.speakQueue = shuffle(due.filter((id) => !session.speakDone.includes(id)));
      }
    }

    function pickReviewCurrent() {
      const session = ensureReviewSession();
      if (!session) return null;
      const phase = reviewPhase(session);
      if (phase === "done") return null;
      ensureReviewQueues(session, phase);
      const pool = phase === "recall" ? session.recallQueue
        : phase === "r1" ? session.r1
        : phase === "r2" ? session.r2
        : phase === "write" ? session.writeQueue
        : session.speakQueue;
      const wordId = pickCoolWord(pool);
      if (!wordId) return null;
      const wordItem = getWord(wordId);
      const base = {
        kind: "review",
        stage: "review",
        phase,
        wordId,
        answered: false,
        submitted: false,
        correct: false,
        chosen: "",
        question: null,
        sense: pickSenseFor(wordItem),
        input: "",
        transcript: "",
        errorCount: 0,
        retryMessage: "",
        hintOpen: false,
        finished: false
      };
      if (phase === "speak") base.blank = buildSpeakBlank(sceneSentence(wordItem), wordItem.word);
      return base;
    }

    function reviewNextDue(session) {
      let best = null;
      session.due.forEach((id) => {
        const entry = state.reviewPool[id];
        if (entry && !entry.mastered && entry.due) {
          if (!best || entry.due < best) best = entry.due;
        }
      });
      return best;
    }

    function reviewEncouragement(summary) {
      if (summary.wrongCount === 0) return `${summary.words} 个到期词四轮零错误，今天的复习很扎实。`;
      if (summary.wrongCount <= 2) return `只错了 ${summary.wrongCount} 次，说明大部分词已经稳了，下次复习会更轻松。`;
      return `今天错了 ${summary.wrongCount} 次，但每个词最后都过了；下次复习会把它们再拉回来。`;
    }

    function buildReviewSummary(session) {
      const durationMs = !session.startMs ? null : Math.max(0, Date.now() - session.startMs);
      const summary = {
        date: dateKey(getToday()),
        durationMs,
        words: session.due.length,
        correctCount: session.correctCount,
        wrongCount: session.wrongCount,
        recallWrong: Number(session.recallWrong) || 0,
        nextDue: reviewNextDue(session),
        mastered: countMastered(),
        encouragement: ""
      };
      summary.encouragement = reviewEncouragement(summary);
      return summary;
    }

    function finishReview() {
      const session = state.reviewSession;
      if (!session || session.summary) return;
      session.summary = buildReviewSummary(session);
      saveState();
    }

    function renderReviewView() {
      const session = ensureReviewSession();
      if (!session) {
        document.getElementById("view-review").innerHTML = `
          <section class="study-card">
            <h2 class="done-title">今天没有到期的复习词</h2>
            <p class="done-text">${getNextReview() ? `下一次复习：${esc(dueText(getNextReview().due))}` : "复习池里还没有词。"}</p>
            <button type="button" class="btn-primary" data-home>返回主界面</button>
          </section>`;
        return;
      }

      const phase = reviewPhase(session);

      // 最后一道题答完时，先把答案反馈留在页面上，点“下一题”再看完成页
      if (phase === "done" && current && current.kind === "review" && (current.answered || current.submitted)) {
        if (!session.summary) finishReview();
        renderReviewCurrent(session, current);
        return;
      }

      if (phase === "done") {
        if (!session.summary) finishReview();
        renderReviewDone();
        return;
      }

      if (!current || current.kind !== "review") current = pickReviewCurrent();
      if (!current) {
        if (!session.summary) finishReview();
        renderReviewDone();
        return;
      }

      if (!deepReady(current.wordId)) {
        holdForDeep(current.wordId, "view-review", () => {
          if (current) {
            current.sense = pickSenseFor(getWord(current.wordId));
            current.question = null;
          }
          renderReviewView();
          renderStats();
        });
        return;
      }

      renderReviewCurrent(session, current);
    }

    function renderReviewCurrent(session, item) {
      const wordItem = getWord(item.wordId);
      const phase = item.phase;
      const phaseLabel = phase === "r1" ? "第 1 轮 · 看英文选中文"
        : phase === "r2" ? "第 2 轮 · 看中文选英文"
        : phase === "write" ? "第 3 轮 · 写"
        : "第 4 轮 · 说";
      const nextKind = "review";

      let bodyHTML = "";
      let feedback = "";

      if (phase === "recall") {
        bodyHTML = `
          <p class="quiz-progress">回想关 · 只看英文自评 · 不计入复习排期</p>
          <div class="quiz-prompt">
            <p class="quiz-word">${esc(wordItem.word)} ${speakBtn(wordItem.word)}</p>
          </div>
          ${item.answered ? "" : `
          <div class="recall-row">
            <button type="button" class="btn-primary" data-recall="ok">想起来了</button>
            <button type="button" class="btn-ghost" data-recall="no">没想起来</button>
          </div>
          <p class="quiz-tip">全部到期词都通过这一关，才进入正式复习；没通过的词会排到队尾。</p>`}`;
        if (item.answered) {
          feedback = `
            <div class="recall-result ${item.correct ? "is-ok" : "is-no"}">
              <p class="recall-title">${item.correct ? "✓ 想起来了，已通过回想关" : "✗ 没想起来，已排到队尾"}</p>
              <p class="quiz-tip">${item.correct
                ? "接下来进入正式复习轮次。"
                : "这个词会在本轮稍后再出现；回想关本身不计入复习排期。"}</p>
            </div>
            <div class="undo-row">
              <button type="button" class="btn-ghost undo-btn" data-undo>↩ 回撤</button>
              <button type="button" class="btn-primary next-btn" data-next="review">确认，下一个</button>
            </div>`;
        }
      } else if (phase === "r1" || phase === "r2") {
        if (!item.question) {
          item.question = phase === "r1" ? buildMeaningQuestion(wordItem) : buildWordQuestion(wordItem);
        }
        bodyHTML = `
          <p class="quiz-progress">${phaseLabel} · 两轮各过一次</p>
          <div class="quiz-prompt">${item.question.promptHTML}</div>
          ${optionsHTML(item.question.values, { answer: item.question.answer, chosen: item.chosen, answered: item.answered })}`;
        if (item.answered) {
          feedback = feedbackHTML({
            ok: item.correct,
            wordItem,
            sense: item.sense,
            extra: item.feedbackExtra,
            nextKind,
            nextLabel: "确认，下一个"
          });
        }
      } else if (phase === "write") {
        bodyHTML = `
          <p class="quiz-progress">${phaseLabel} · 看中文提示写出英文单词</p>
          <div class="quiz-prompt">
            ${sceneArtHTML(wordItem.word)}
            <p class="quiz-def">${esc(wordItem.core_image)}</p>
            <p class="quiz-tip">义项：${esc(wordItem.definition_zh)}</p>
            <p class="quiz-tip">场景中文解释：${esc(sceneHintCN(wordItem))}</p>
          </div>
          <div class="write-row">
            <input class="write-input" id="reviewWriteInput" type="text" inputmode="latin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入英文单词" value="${esc(item.input)}" ${item.submitted ? "disabled" : ""}>
            <button type="button" class="btn-primary" id="reviewWriteSubmit" ${item.submitted ? "disabled" : ""}>提交</button>
          </div>
          <p class="quiz-tip" id="reviewWriteHint">忽略大小写、首尾空格和结尾标点；回车也能提交。</p>`;
        if (item.submitted) {
          feedback = feedbackHTML({
            ok: item.correct,
            wordItem,
            sense: item.sense,
            note: sceneNote(wordItem),
            extra: item.correct
              ? (item.finished ? "写完成，点「确认」进入说。" : "")
              : "已排到写队列末尾，3–7 个其他词之后再出现。",
            nextKind,
            nextLabel: item.finished ? "确认，进入说阶段" : "确认，下一个"
          });
        }
      } else {
        if (!item.blank) item.blank = buildSpeakBlank(sceneSentence(wordItem), wordItem.word);
        bodyHTML = `
          <p class="quiz-progress">${phaseLabel} · 题面不出现答案单词</p>
          <div class="quiz-prompt">
            ${sceneArtHTML(wordItem.word)}
            <p class="quiz-scene">${esc(item.blank.text)}</p>
          </div>
          ${item.submitted ? "" : speakHintHTML(item, wordItem, "review")}
          ${speechAskHTML(item)}`;
        if (item.submitted) {
          feedback = feedbackHTML({
            ok: item.correct,
            wordItem,
            sense: item.sense,
            note: sceneNote(wordItem),
            extra: item.correct ? "" : "已排到说队列末尾，3–7 个其他词之后再出现。",
            nextKind,
            nextLabel: item.correct && (session.speakDone.length >= session.due.length) ? "确认，查看复习完成页" : "确认，下一个"
          });
        }
      }

      document.getElementById("view-review").innerHTML = `
        <section class="study-card">
          ${studyHeadHTML("复习", [
            `到期词 <b>${session.due.length}</b>`,
            `答对 <b>${session.correctCount}</b>`,
            `答错 <b>${session.wrongCount}</b>`
          ])}
          <div class="quiz-body">
            ${bodyHTML}
            ${feedback || undoBarHTML()}
          </div>
        </section>`;
    }

    // 回想关：只做自评，不调用 answerReview，因此不改 dueDate、不计入答错
    function answerRecall(pass) {
      const session = state.reviewSession;
      if (!session || !current || current.phase !== "recall" || current.answered) return;
      takeUndoSnapshot();
      const wordId = current.wordId;
      current.answered = true;
      current.correct = Boolean(pass);
      markAnswered(wordId);
      session.recallQueue = session.recallQueue.filter((id) => id !== wordId);
      if (pass) {
        if (!session.recallPassed.includes(wordId)) session.recallPassed.push(wordId);
        if (session.recallPassed.length >= session.due.length) session.recallDone = true;
      } else {
        session.recallWrong += 1;
        session.recallQueue.push(wordId);
      }
      saveState();
      renderReviewView();
      renderStats();
    }

    // 复习答错：清空该词后续轮次的通过记录，退回第 1 轮重走完整轮次
    function resetReviewWordToFirstRound(session, wordId) {
      session.r1Passed = session.r1Passed.filter((id) => id !== wordId);
      session.r2Passed = session.r2Passed.filter((id) => id !== wordId);
      session.writeDone = session.writeDone.filter((id) => id !== wordId);
      session.speakDone = session.speakDone.filter((id) => id !== wordId);
      session.r2 = session.r2.filter((id) => id !== wordId);
      session.writeQueue = session.writeQueue.filter((id) => id !== wordId);
      session.speakQueue = session.speakQueue.filter((id) => id !== wordId);
      if (!session.r1.includes(wordId)) session.r1.push(wordId);
    }

    function answerReviewOption(correct, chosen) {
      const session = state.reviewSession;
      if (!session || !current) return;
      const wordId = current.wordId;
      const phase = current.phase;
      const wordItem = getWord(wordId);
      markAnswered(wordId);
      let extra = "";

      if (correct) {
        session.correctCount += 1;
        if (phase === "r1") {
          if (!session.r1Passed.includes(wordId)) session.r1Passed.push(wordId);
          session.r1 = session.r1.filter((id) => id !== wordId);
          if (session.r1Passed.length >= session.due.length) extra = "第 1 轮完成，点「下一题」进入第 2 轮。";
        } else {
          if (!session.r2Passed.includes(wordId)) session.r2Passed.push(wordId);
          session.r2 = session.r2.filter((id) => id !== wordId);
          if (!session.graded.includes(wordId)) {
            const graded = answerReview(wordId, !session.hadWrong[wordId]);
            session.graded.push(wordId);
            if (graded.text) extra = graded.text;
          }
          if (session.r2Passed.length >= session.due.length) {
            extra = `${extra ? extra + " " : ""}两轮认词完成，点「下一题」进入写。`;
          }
        }
      } else {
        session.wrongCount += 1;
        session.hadWrong[wordId] = true;
        bumpWrong();
        if (phase === "r1") {
          session.r1 = session.r1.filter((id) => id !== wordId);
          session.r1.push(wordId);
          extra = "这个词会在 3–7 个其他词之后重新出现。";
        } else {
          // 第 2 轮答错：清空该词后续轮次的通过记录，退回第 1 轮重走完整轮次
          resetReviewWordToFirstRound(session, wordId);
          extra = "这个词已退回第 1 轮，重新走完整轮次。";
        }
      }

      current.answered = true;
      current.correct = correct;
      current.chosen = chosen;
      current.feedbackExtra = extra;
      saveState();
    }

    function submitReviewWrite() {
      const session = state.reviewSession;
      if (!session || !current || current.phase !== "write" || current.submitted) return;
      const input = document.getElementById("reviewWriteInput");
      if (!input) return;
      const raw = input.value;
      if (!raw.trim()) {
        const hint = document.getElementById("reviewWriteHint");
        if (hint) hint.textContent = "先输入一个英文单词再提交。";
        return;
      }

      current.input = raw;
      takeUndoSnapshot();
      const wordItem = getWord(current.wordId);
      const wordId = current.wordId;
      const correct = normalizeWord(raw) === normalizeWord(wordItem.word);

      markAnswered(wordId);
      current.submitted = true;
      current.correct = correct;

      if (correct) {
        session.correctCount += 1;
        session.writeQueue = session.writeQueue.filter((id) => id !== wordId);
        if (!session.writeDone.includes(wordId)) session.writeDone.push(wordId);
        if (session.writeDone.length >= session.due.length) current.finished = true;
      } else {
        session.wrongCount += 1;
        bumpWrong();
        session.writeQueue = session.writeQueue.filter((id) => id !== wordId);
        session.writeQueue.push(wordId);
      }

      saveState();
      renderReviewView();
      renderStats();
    }

    function finishReviewSpeak(correct) {
      const session = state.reviewSession;
      if (!session || !current || current.phase !== "speak" || current.submitted) return;
      takeUndoSnapshot();
      const wordItem = getWord(current.wordId);
      const wordId = current.wordId;
      current.submitted = true;
      current.correct = correct;
      markAnswered(wordId);

      if (correct) {
        session.correctCount += 1;
        session.speakQueue = session.speakQueue.filter((id) => id !== wordId);
        if (!session.speakDone.includes(wordId)) session.speakDone.push(wordId);
        if (session.speakDone.length >= session.due.length) finishReview();
      } else {
        // 复习说答错：退回第 1 轮重走完整轮次
        session.wrongCount += 1;
        bumpWrong();
        resetReviewWordToFirstRound(session, wordId);
      }

      saveState();
      renderReviewView();
      renderStats();
    }

        : emptyNote();

      const collocationsHTML = wordItem.collocations.length
        ? wordItem.collocations.map((item) => pair(item.phrase, item.zh)).join("")
        : emptyNote();

      const examplesHTML = wordItem.examples.length
        ? wordItem.examples.map((item) => pair(item.en, item.cn)).join("")
        : emptyNote();

      return `
        <div class="dict-block"><p class="dict-label">发音</p>${pronHTML}</div>
        <div class="dict-block"><p class="dict-label">释义</p>${meaningsHTML}</div>
        <div class="dict-block"><p class="dict-label">变形</p>${formsHTML}</div>
        <div class="dict-block"><p class="dict-label">助记</p>${mnemonicHTML}</div>
        <div class="dict-block"><p class="dict-label">词根</p>${rootHTML}</div>
        <div class="dict-block"><p class="dict-label">派生词</p>${derivativesHTML}</div>
        <div class="dict-block"><p class="dict-label">词组搭配</p>${collocationsHTML}</div>
        <div class="dict-block"><p class="dict-label">例句</p>${examplesHTML}</div>`;
    }

    function renderCard(wordItem, withHeader = true) {
      const el = document.createElement("article");
      el.className = "card word-card";

      const sensesHTML = wordItem.senses.length
        ? wordItem.senses.map((sense, index) => `
          <div class="sense${index === 0 ? " is-open" : ""}">

      const hasMap = wordItem.semanticMap.chain.length > 0 || wordItem.semanticMap.branches.length > 0;

        const arrow = index < wordItem.semanticMap.chain.length - 1 ? '<span class="chain-arrow">→</span>' : "";

        </div>`).join("");

      const etymologyHTML = wordItem.etymology.items.length
        ? `${wordItem.etymology.intro.en ? pair(wordItem.etymology.intro.en, wordItem.etymology.intro.cn) : ""}
          ${wordItem.etymology.items.map((item) => `
            <div class="etym-item">
              <span class="etym-era">${esc(item.era)}</span>
              ${pair(item.en, item.cn)}
            </div>`).join("")}`

      const hasAffix = wordItem.affixes.items.length > 0 || wordItem.affixes.latinEntries.length > 0;
      const affixesHTML = wordItem.affixes.items.map((item) => `

            ${speakBtn(item.word)}
          </div>
          ${pair(item.meaning, item.meaningCN)}
        </div>`).join("");
      const affixIntroHTML = wordItem.affixes.intro.en ? pair(wordItem.affixes.intro.en, wordItem.affixes.intro.cn) : "";
      const latinIntroHTML = wordItem.affixes.latinIntro.en ? pair(wordItem.affixes.latinIntro.en, wordItem.affixes.latinIntro.cn) : "";

      const similarHTML = wordItem.similar.groups.length
        ? `${wordItem.similar.note.en ? pair(wordItem.similar.note.en, wordItem.similar.note.cn) : ""}
          ${wordItem.similar.groups.map((group) => `
            <p class="subtitle">${esc(group.heading)}</p>
            ${group.entries.map((entry) => `
              <div class="similar-item">
                <div class="entry-head">
                  <span class="entry-word">${esc(entry.word)}</span>
                  <span class="ipa">${esc(entry.ipa)}</span>
                  <span class="tag">${esc(entry.tag)}</span>
                  ${speakBtn(entry.word)}
                </div>
                ${pair(entry.definition, entry.definitionCN)}
              </div>`).join("")}`).join("")}`
        : emptyNote();

      const hasMnemonic = wordItem.mnemonics.normal.length > 0 || wordItem.mnemonics.abstract.length > 0;
      const normalHTML = wordItem.mnemonics.normal.map((item) => pair(item.en, item.cn)).join("");
      const abstractHTML = wordItem.mnemonics.abstract.map((item) => pair(item.en, item.cn)).join("");
      const mnemonicIntroHTML = wordItem.mnemonics.normalIntro.en
        ? pair(wordItem.mnemonics.normalIntro.en, wordItem.mnemonics.normalIntro.cn)
        : "";

      const headerHTML = withHeader ? `
        <header>
          <div class="word-row">
            <h1 class="word">${esc(wordItem.word)}</h1>
            <span class="ipa">英 ${esc(wordItem.ipa_uk)} · 美 ${esc(wordItem.ipa_us)}</span>
            ${speakBtn(wordItem.word)}
          </div>
          <p class="word-def">${esc(wordItem.definition_zh)}</p>
          <p class="word-en">${esc(wordItem.definition_en)} ${speakBtn(wordItem.definition_en, "en-US", "🔊 AI 朗读")}</p>
          <p class="core-image">核心意象：${esc(wordItem.core_image)}</p>
          ${sceneArtHTML(wordItem.word)}
          <p class="word-scene">${esc(wordItem.scene)} ${speakBtn(wordItem.scene, "en-US", "🔊 AI 朗读")}</p>
          <p class="word-scene word-scene-cn">${esc(wordItem.sceneCN || "")}</p>
        </header>` : "";

      el.innerHTML = `
        ${headerHTML}

        <nav class="tabs" role="tablist" aria-label="内容分区">
          <button type="button" class="tab is-active" data-tab="dict" role="tab" aria-selected="true">速览</button>
          <button type="button" class="tab" data-tab="senses" role="tab" aria-selected="false">核心义项</button>
          <button type="button" class="tab" data-tab="map" role="tab" aria-selected="false">语义地图</button>
          <button type="button" class="tab" data-tab="etym" role="tab" aria-selected="false">词源</button>
          <button type="button" class="tab" data-tab="affix" role="tab" aria-selected="false">词缀 / 词族</button>
          <button type="button" class="tab" data-tab="similar" role="tab" aria-selected="false">相似词</button>
          <button type="button" class="tab" data-tab="mnemonic" role="tab" aria-selected="false">联想记忆</button>
        </nav>

        <section class="tab-panel" data-panel="dict">
          <p class="subtitle">DICTIONARY SNAPSHOT</p>
          ${renderDict(wordItem)}
        </section>

        <section class="tab-panel" data-panel="senses" hidden>
          ${wordItem.sensesIntro.en ? pair(wordItem.sensesIntro.en, wordItem.sensesIntro.cn) : ""}
          ${sensesHTML}
        </section>

        <section class="tab-panel" data-panel="map" hidden>
          <p class="subtitle">SEMANTIC MAP</p>
          ${hasMap ? `
            ${wordItem.semanticMap.core.en ? pair(wordItem.semanticMap.core.en, wordItem.semanticMap.core.cn) : ""}
            <div class="map-arrow">↓</div>
            <div class="map-chain">${chainHTML}</div>
            <div class="map-arrow">↓</div>
            <div class="branches">${branchesHTML}</div>` : emptyNote()}
        </section>

        <section class="tab-panel" data-panel="etym" hidden>
          <p class="subtitle">ETYMOLOGY</p>
          ${etymologyHTML}
        </section>

        <section class="tab-panel" data-panel="affix" hidden>
          <p class="subtitle">WORD FAMILY: PREFIXES &amp; SUFFIXES</p>
          ${hasAffix ? `
            ${affixIntroHTML}
            ${affixesHTML}
            ${wordItem.affixes.latinEntries.length ? `<p class="subtitle">ANOTHER BORROWING FAMILY</p>${latinIntroHTML}${latinHTML}` : ""}
          ` : emptyNote()}
        </section>

        <section class="tab-panel" data-panel="similar" hidden>
          <p class="subtitle">EASY TO CONFUSE</p>
          ${similarHTML}
        </section>

        <section class="tab-panel" data-panel="mnemonic" hidden>
          <p class="subtitle">MEMORY HOOKS</p>
          ${hasMnemonic ? `
            ${mnemonicIntroHTML}
            ${wordItem.mnemonics.abstract.length ? `<button type="button" class="mnemonic-switch" aria-pressed="false">🧩 抽象联想</button>` : ""}
            <div class="mnemonic-panel mnemonic-normal">${normalHTML}</div>
            <div class="mnemonic-panel mnemonic-abstract" hidden>
              ${wordItem.word === "break" ? `
                <div class="crack-demo" aria-hidden="true">
                  <div class="crack-force">FORCE ↓</div>
                  <div class="crack-slab">
                    <span class="crack-half left"></span>
                    <span class="crack-half right"></span>
                  </div>
                  <div class="crack-caption">one whole → two parts + a gap</div>
                  <div class="flow">
                    <span class="flow-seg"></span>
                    <span class="flow-gap"></span>
                    <span class="flow-seg"></span>
                  </div>
                  <div class="crack-caption">a continuity, cut</div>
                </div>` : ""}
              ${abstractHTML}
            </div>` : emptyNote()}
        </section>
      `;

      return el;
    }

    let browseIndex = 0;

    // ============================================================
    // 14. 全部单词 A–Z：字母分组 + 首字母索引定位
    // ============================================================
    function azGroups() {
      const sorted = words.slice().sort((a, b) => {
        const left = a.word.toLowerCase();
        const right = b.word.toLowerCase();
        if (left < right) return -1;
        if (left > right) return 1;
        return 0;
      });
      const groups = new Map();
      sorted.forEach((item) => {
        const letter = /^[a-z]/i.test(item.word) ? item.word[0].toUpperCase() : "#";
        if (!groups.has(letter)) groups.set(letter, []);
        groups.get(letter).push(item);
      });
      const letters = [...groups.keys()].sort((a, b) => {
        if (a === "#") return 1;
        if (b === "#") return -1;
        return a < b ? -1 : a > b ? 1 : 0;
      });
      return { groups, letters };
    }

    function renderAz() {
      const { groups, letters } = azGroups();
      const body = letters.map((letter) => `
        <section class="az-group" id="azGroup-${letter}">
          <h2 class="az-group-title">${letter}</h2>
          ${groups.get(letter).map((item) => `
            <button type="button" class="az-row" data-open-word="${esc(item.word)}"><span class="az-word">${esc(item.word)}</span></button>`).join("")}
        </section>`).join("");
      document.getElementById("view-az").innerHTML = `
        <section class="browse-bar">
          <button type="button" class="browse-step" data-enter="library">← 我的词书</button>
          <span class="browse-pos">全部 ${words.length.toLocaleString()} 个词</span>
          <span class="browse-pos">A–Z</span>
        </section>
        <div class="az-index">
          ${letters.map((letter) => `<button type="button" class="az-letter" data-az-letter="${letter}">${letter}</button>`).join("")}
        </div>
        <article class="card az-card"><div class="az-list" id="azList">${body}</div></article>`;
    }

    function renderBrowse() {
      const mount = document.getElementById("cardMount");
      const pos = document.getElementById("browsePos");
      mount.innerHTML = "";
      if (!words.length) {
        mount.innerHTML = `<section class="empty-card">该词深度内容尚未准备</section>`;
        pos.textContent = "0 / 0";
        return;
      }
      if (browseIndex >= words.length) browseIndex = 0;
      const browseWord = words[browseIndex];
      if (browseWord && !deepReady(browseWord.word)) {
        holdForDeep(browseWord.word, "cardMount", renderBrowse);
        pos.textContent = `${browseIndex + 1} / ${words.length}`;
        return;
      }
      mount.appendChild(renderCard(browseWord));
      pos.textContent = `${browseIndex + 1} / ${words.length}`;
    }

    // ============================================================
    // 14. 预习：下一批已备词，左右滑动 / 箭头切换
    // ============================================================
    let previewIndex = 0;
    let previewTouchX = null;

    // 已备池中尚未学过、也不在今日队列里的下一批；预抽后当天刷新保持不变
    function previewWords() {
      return ensurePreviewBatch().map((id) => getWord(id)).filter(Boolean);
    }

    function movePreview(step) {
      const list = previewWords();
      if (!list.length) return;
      const next = previewIndex + step;
      if (next < 0 || next >= list.length) return;
      previewIndex = next;
      renderPreview();
    }

    function renderPreview() {
      const previewList = previewWords();
      const view = document.getElementById("view-preview");

      if (!previewList.length) {
        const remaining = availableLearnIds().length;
        view.innerHTML = `
          <section class="study-card empty-card">
            <h2 class="done-title">${remaining ? "已备内容不足，需要补充词条" : "该词深度内容尚未准备"}</h2>
            <p class="done-text">${remaining
              ? `剩余已备词 ${remaining} 个，不足一批 10 个；补充深度词条后这里会自动出现下一批。`
              : "已备池里暂时没有尚未学过的词；等下一批深度内容入库后，这里会自动出现。"}</p>
            <button type="button" class="btn-primary" data-home>返回主界面</button>
          </section>`;
        return;
      }

      if (previewIndex >= previewList.length) previewIndex = 0;
      const wordItem = previewList[previewIndex];
      if (!deepReady(wordItem.word)) {
        holdForDeep(wordItem.word, "view-preview", renderPreview);
        return;
      }
      // 预取这一批的其余词，左右切换时不必再等加载
      previewList.forEach((item) => ensureDeep(item.word));

      const globalIndex = words.findIndex((item) => item.word === wordItem.word);
      view.innerHTML = `
        <section class="browse-bar">
          <button type="button" class="browse-step" data-preview-step="-1" ${previewIndex === 0 ? "disabled" : ""}>← 上一个</button>
          <span class="browse-pos">${previewIndex + 1} / ${previewList.length}</span>
          <button type="button" class="browse-step" data-preview-step="1" ${previewIndex === previewList.length - 1 ? "disabled" : ""}>下一个 →</button>
        </section>
        <article class="preview-card">
          <div class="preview-deep"></div>
          <p class="quiz-tip">左右滑动卡片，或点上方箭头切换单词。</p>
          <button type="button" class="btn-ghost" data-open-browse="${globalIndex}">在词库浏览查看完整词卡</button>
        </article>`;
      // 预习直接展示完整深度词条（与词库浏览同一套内容）
      const deepMount = view.querySelector(".preview-deep");
      if (deepMount) deepMount.appendChild(renderCard(wordItem));

      // 滑动切换：横向位移超过 40px 才算
      view.ontouchstart = (event) => {
        previewTouchX = event.touches[0] ? event.touches[0].clientX : null;
      };
      view.ontouchend = (event) => {
        if (previewTouchX === null) return;
        const touch = event.changedTouches[0];
        const diff = (touch ? touch.clientX : previewTouchX) - previewTouchX;
        previewTouchX = null;
        if (Math.abs(diff) >= 40) movePreview(diff < 0 ? 1 : -1);
      };
    }

    // ============================================================
    // 15. 顶部状态条 / 视图切换
    // ============================================================
    function renderStats() {
      const top = document.getElementById("topStats");
      // 首页与我的词书页不显示顶部状态条，复习池信息只在词书页里
      if (viewMode === "home" || viewMode === "library") {
        top.hidden = true;
        top.innerHTML = "";
        return;
      }
      top.hidden = false;
      top.innerHTML = `<span class="stat">今日待学 <b>${todayRemaining()}</b> / ${sessionWordCount()}</span>`;
    }

    let viewMode = "home";

    function viewTitle() {
      if (viewMode === "study") return `新学 · ${STAGE_LABELS[state.stage]}`;
      if (viewMode === "review") return "复习 · 四轮";
      if (viewMode === "preview") return "预习 · 下一批";
      if (viewMode === "browse") return "词库浏览";
      if (viewMode === "az") return "全部单词 · A–Z";
      if (viewMode === "library") return "我的词书";
      return "";
    }

    function renderView() {
      const views = {
        home: "view-home",
        study: "view-study",
        review: "view-review",
        library: "view-library",
        preview: "view-preview",
        browse: "view-browse",
        az: "view-az"
      };
      Object.keys(views).forEach((key) => {
        document.getElementById(views[key]).hidden = key !== viewMode;
      });
      document.getElementById("viewNav").hidden = viewMode === "home";
      document.getElementById("viewTitle").textContent = viewTitle();

      if (viewMode === "home") renderHome();
      else if (viewMode === "study") renderStudyView();
      else if (viewMode === "review") renderReviewView();
      else if (viewMode === "library") renderLibrary();
      else if (viewMode === "preview") renderPreview();
      else if (viewMode === "az") renderAz();
      else renderBrowse();
    }

    function renderAll() {
      renderStats();
      renderView();
    }

    function showView(mode) {
      viewMode = mode;
      current = null;
      writeCurrent = null;
      speakCurrent = null;

      // 进入新学前按每日目标锁定今日队列；只抽一次，不再补词
      if (mode === "study") ensureLearnSession();

      // 只有真实进入新学才启动计时
      if (mode === "study" && state.stage !== "done" && state.learnStartedMs === 0) {
        state.learnStartedMs = Date.now();
        saveState();
      }

      renderView();
      renderStats();
    }

    // ============================================================
    // 16. 朗读：全页共用
    // ============================================================
    function speak(button) {
      if (!canSpeak) {
        alert("当前浏览器不支持语音朗读，建议使用新版 Chrome、Edge 或 Safari。");
        return;
      }
      const text = button.dataset.say;
      const label = button.dataset.label;

      document.querySelectorAll(".speak.is-playing").forEach((other) => {
        other.classList.remove("is-playing");
        other.textContent = other.dataset.label;
      });

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = button.dataset.lang || "en-US";
      utterance.rate = Number(button.dataset.rate) || 0.9;

      button.classList.add("is-playing");
      button.textContent = "🔊 AI 朗读中…";
      const reset = () => {
        button.classList.remove("is-playing");
        button.textContent = label;
      };
      utterance.onend = reset;
      utterance.onerror = reset;

      window.speechSynthesis.speak(utterance);
    }

    // ============================================================
    // 17. 作答反馈 / 回撤 / 键盘 / 交互委托
    // ============================================================
    let toastTimer = null;

    const ENCOURAGE_LINES = [
      "这一组全过了，稳稳收工。",
      "十个词全部拿下，状态在线。",
      "整组通关，今天很可以。",
      "都记住了，继续保持这个节奏。",
      "一次比一次顺，明天见。"
    ];
    const ENCOURAGE_FACES = ["(￣▽￣)", "(*¯︶¯*)", "（＾∇＾）", "(ﾟoﾟ;;"];

    // 今日整组词全部通过时的鼓励提示：每次都随机换一句和一个颜文字
    function showEncouragement() {
      const el = document.getElementById("toast");
      if (!el) return;
      const line = ENCOURAGE_LINES[Math.floor(Math.random() * ENCOURAGE_LINES.length)];
      const face = ENCOURAGE_FACES[Math.floor(Math.random() * ENCOURAGE_FACES.length)];
      el.textContent = `${line} ${face}`;
      el.hidden = false;
      el.classList.add("is-celebrate");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.hidden = true;
        el.classList.remove("is-celebrate");
      }, 4500);
    }

    function showToast(text) {
      const el = document.getElementById("toast");
      if (!el) return;
      el.textContent = text;
      el.classList.remove("is-celebrate");
      el.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.hidden = true; }, 2000);
    }

    function takeUndoSnapshot() {
      const clone = (value) => (value ? JSON.parse(JSON.stringify(value)) : null);
      undoSnapshot = {
        state: clone(state),
        current: clone(current),
        writeCurrent: clone(writeCurrent),
        speakCurrent: clone(speakCurrent),
        viewMode
      };
      undoUsed = false;
    }

    function doUndo() {
      if (undoUsed) {
        showToast("只能回撤一步");
        return;
      }
      if (!undoSnapshot) {
        showToast("没有可以回撤的作答");
        return;
      }
      state = undoSnapshot.state;
      current = undoSnapshot.current;
      writeCurrent = undoSnapshot.writeCurrent;
      speakCurrent = undoSnapshot.speakCurrent;
      viewMode = undoSnapshot.viewMode || viewMode;
      undoUsed = true;
      saveState();
      renderAll();
      showToast("已回撤一步；只能回撤一次。");
    }

    function handleOption(button) {
      if (!current || current.answered || !current.question) return;
      takeUndoSnapshot();
      const answer = current.question.answer;
      const chosen = button.dataset.value;
      const correct = chosen === answer;

      if (current.kind === "review") answerReviewOption(correct, chosen);
      else answerLearnOption(correct, chosen);

      if (viewMode === "review") renderReviewView();
      else renderStudyView();
      renderStats();
    }

    function optionButtons() {
      return [...document.querySelectorAll("#view-study .option:not(:disabled), #view-review .option:not(:disabled)")];
    }

    function moveHighlight(step) {
      const options = optionButtons();
      if (!options.length) return false;
      let index = options.findIndex((item) => item.classList.contains("is-highlight"));
      index = index < 0 ? 0 : (index + step + options.length) % options.length;
      options.forEach((item) => item.classList.remove("is-highlight"));
      options[index].classList.add("is-highlight");
      return true;
    }

    function confirmHighlight() {
      const options = optionButtons();
      if (!options.length) return false;
      const selected = options.find((item) => item.classList.contains("is-highlight")) || options[0];
      selected.click();
      return true;
    }

    function handleNext(kind) {
      if (kind === "learn") {
        current = null;
        renderStudyView();
        renderStats();
        return;
      }

      if (kind === "write") {
        writeCurrent = null;
        renderStudyView();
        renderStats();
        return;
      }

      if (kind === "speak") {
        speakCurrent = null;
        renderStudyView();
        renderStats();
        return;
      }

      if (kind === "review") {
        current = null;
        renderReviewView();
        renderStats();
        return;
      }

      current = null;
      renderView();
      renderStats();
    }

    // 词书选择器：切换后立即换书，并把选择写入现有存档
    document.addEventListener("change", (event) => {
      const select = event.target.closest("[data-book-select]");
      if (select) switchBook(select.value);
    });

    document.addEventListener("keydown", (event) => {
      const target = event.target;

      // 速览卡：按回车 = 确认下一个
      if (event.key === "Enter") {
        const summaryNext = document.querySelector(".summary-card .next-btn");
        if (summaryNext) {
          event.preventDefault();
          summaryNext.click();
          return;
        }
      }

      // 文本输入框：回车提交
      if (target && target.tagName === "INPUT") {
        if (event.key === "Enter") {
          if (target.id === "writeInput") {
            event.preventDefault();
            submitWrite();
          } else if (target.id === "reviewWriteInput") {
            event.preventDefault();
            submitReviewWrite();
          }
        }
        return;
      }

      if (!["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Enter"].includes(event.key)) return;
      if (viewMode !== "study" && viewMode !== "review") return;
      const options = optionButtons();
      if (!options.length) return;

      event.preventDefault();
      if (event.key === "Enter") {
        confirmHighlight();
        return;
      }
      moveHighlight(event.key === "ArrowDown" || event.key === "ArrowRight" ? 1 : -1);
    });

    document.addEventListener("click", (event) => {
      // 发音按钮（含慢速示范）
      const speakButton = event.target.closest(".speak");
      if (speakButton) {
        if (!speakButton.disabled) speak(speakButton);
        return;
      }

      // 中文显示 / 隐藏：只影响自己所在的 .cn-scope
      const toggle = event.target.closest(".toggle");
      if (toggle) {
        const scope = toggle.closest(".cn-scope");
        const cn = scope && scope.querySelector(".cn");
        if (cn) {
          const willShow = cn.hidden;
          cn.hidden = !willShow;
          toggle.textContent = willShow ? "隐藏中文" : "显示中文";
          toggle.classList.toggle("is-open", willShow);
          toggle.setAttribute("aria-expanded", String(willShow));
        }
        return;
      }

      // 义项折叠
      const senseToggle = event.target.closest(".sense-toggle");
      if (senseToggle) {
        const sense = senseToggle.closest(".sense");
        const body = sense.querySelector(".sense-body");
        const willOpen = body.hidden;
        body.hidden = !willOpen;
        sense.classList.toggle("is-open", willOpen);
        senseToggle.setAttribute("aria-expanded", String(willOpen));
        return;
      }

      // 词卡分区 tab
      const tab = event.target.closest(".tab");
      if (tab) {
        const card = tab.closest(".word-card");
        card.querySelectorAll(".tab").forEach((item) => {
          const on = item === tab;
          item.classList.toggle("is-active", on);
          item.setAttribute("aria-selected", String(on));
        });
        card.querySelectorAll(".tab-panel").forEach((panel) => {
          panel.hidden = panel.dataset.panel !== tab.dataset.tab;
        });
        return;
      }

      // 正常联想 / 抽象联想切换
      const switcher = event.target.closest(".mnemonic-switch");
      if (switcher) {
        const card = switcher.closest(".word-card");
        const showAbstract = !switcher.classList.contains("is-abstract");
        switcher.classList.toggle("is-abstract", showAbstract);
        switcher.textContent = showAbstract ? "↩ 正常联想" : "🧩 抽象联想";
        switcher.setAttribute("aria-pressed", String(showAbstract));
        card.querySelector(".mnemonic-normal").hidden = showAbstract;
        card.querySelector(".mnemonic-abstract").hidden = !showAbstract;
        return;
      }

      // 返回主界面
      if (event.target.closest("#backHome") || event.target.closest("[data-home]")) {
        showView("home");
        return;
      }

      // 完成页：再学一组（次数不限，立刻进认词）
      if (event.target.closest("[data-next-group]")) {
        startNextGroup();
        return;
      }

      // 首页：每天学习 10 / 15 / 20
      const targetButton = event.target.closest("[data-target]");
      if (targetButton) {
        const value = Number(targetButton.dataset.target);
        const dailyOptions = activeBookConfig.dailyOptions || [10, 15, 20];
        if (!dailyOptions.includes(value)) return;
        if (state.learnWords.length && state.stage !== "done") {
          showToast("今日队列已锁定，新数量从下一组生效。");
        }
        state.dailyTarget = value;
        // 数量只影响“下一组”：预习立即按新数量重抽，当前正在学的这组保持不变
        state.previewBatch = [];
        state.previewBatchDate = "";
        saveState();
        renderView();
        return;
      }

      // 主界面入口
      const enterButton = event.target.closest("[data-enter]");
      if (enterButton) {
        const target = enterButton.dataset.enter;
        if (target === "study" && state.stage === "done") {
          startNextGroup();
          return;
        }
        if (target === "review") {
          const session = state.reviewSession;
          const active = Boolean(session && session.date === dateKey(getToday()) && !session.summary && reviewPhase(session) !== "done");
          if (getDueWords().length === 0 && !active) return;
        }
        showView(target);
        return;
      }

      // 阶段 1：看完完整词条即确认这个词，直接换下一个（每个词在认词关只出现一次）
      if (event.target.closest("[data-intro-done]")) {
        if (!current || current.kind !== "learn" || current.stage !== "stage1") return;
        const wordId = current.wordId;
        const done = learnDoneList("stage1");
        if (!done.includes(wordId)) done.push(wordId);
        // 确认即算一次作答：这个词要隔 3–7 个其他词才会在后续阶段再被抽到
        markAnswered(wordId);
        current = null;
        saveState();
        renderStudyView();
        renderStats();
        return;
      }

      // 词库浏览：上一个 / 下一个单词
      const stepButton = event.target.closest("[data-step]");
      if (stepButton) {
        if (!words.length) return;
        const step = Number(stepButton.dataset.step);
        browseIndex = (browseIndex + step + words.length) % words.length;
        renderBrowse();
        return;
      }

      // 预习：箭头切换
      const previewButton = event.target.closest("[data-preview-step]");
      if (previewButton) {
        movePreview(Number(previewButton.dataset.previewStep));
        return;
      }

      // 预习：打开完整词卡
      const openBrowse = event.target.closest("[data-open-browse]");
      if (openBrowse) {
        browseIndex = Number(openBrowse.dataset.openBrowse) || 0;
        showView("browse");
        return;
      }

      // 全部单词 A–Z：点字母定位到分组起点
      const azLetter = event.target.closest("[data-az-letter]");
      if (azLetter) {
        const group = document.getElementById(`azGroup-${azLetter.dataset.azLetter}`);
        if (group) group.scrollIntoView({ block: "start" });
        return;
      }

      // 全部单词 A–Z：点单词打开深度词卡
      const azWord = event.target.closest("[data-open-word]");
      if (azWord) {
        const index = words.findIndex((item) => item.word === azWord.dataset.openWord);
        if (index >= 0) {
          browseIndex = index;
          showView("browse");
        }
        return;
      }

      // 写阶段：提交
      if (event.target.closest("#writeSubmit")) {
        submitWrite();
        return;
      }
      if (event.target.closest("#reviewWriteSubmit")) {
        submitReviewWrite();
        return;
      }

      // 说阶段：开始朗读 / 改自评 / 自评判分
      const speechButton = event.target.closest("[data-speech]");
      if (speechButton) {
        if (speechButton.dataset.speech === "start") startSpeech();
        else if (speechButton.dataset.speech === "fallback") {
          speakFallback = true;
          rerenderQuiz();
        }
        return;
      }
      const speakJudge = event.target.closest("[data-speak-judge]");
      if (speakJudge) {
        finishSpeechAnswer(speakJudge.dataset.speakJudge === "ok");
        return;
      }

      // 说阶段：看一眼提示（不判错）
      const hintButton = event.target.closest("[data-hint-toggle]");
      if (hintButton) {
        const target = speechTarget();
        if (!target) return;
        target.hintOpen = !target.hintOpen;
        rerenderQuiz();
        return;
      }

      // 选项
      const option = event.target.closest(".option");
      if (option && (viewMode === "study" || viewMode === "review")) {
        handleOption(option);
        return;
      }

      // 回想关自评（不影响复习排期）
      const recallButton = event.target.closest("[data-recall]");
      if (recallButton && viewMode === "review") {
        answerRecall(recallButton.dataset.recall === "ok");
        return;
      }

      // 回撤（只允许一步）
      const undoButton = event.target.closest("[data-undo]");
      if (undoButton) {
        doUndo();
        return;
      }

      // 下一题 / 下一个
      const nextButton = event.target.closest("[data-next], .next-btn");
      if (nextButton) {
        handleNext(nextButton.dataset.next || "quiz");
        return;
      }
    });

    // ============================================================
    // 18. 启动：先尝试 words.json，失败则用内嵌副本
    // ============================================================
    function boot() {
      // file:// 或接口缺失时用内嵌兜底词表，同样走 22 键容错
      if (words === WORDS_FALLBACK.groups[0]) {
        preparedEntries = preparedEntries.map(normalizeEntry);
        words = preparedEntries;
      }
      state = loadState();
      // 词书允许的每日数量范围可能不同，存档里的目标值不合法时回退到该书第一档
      const bookDailyOptions = activeBookConfig.dailyOptions || [10, 15, 20];
      if (!bookDailyOptions.includes(state.dailyTarget)) state.dailyTarget = bookDailyOptions[0];
      rolloverLearnDay();
      syncGroupStatsDate();
      saveState();
      viewMode = "home";
      renderAll();
    }

    function fetchJson(url) {
      return fetch(url, { cache: "no-store" }).then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      });
    }

    function applyBookData(book, prepared, distractors) {
      if (book && Array.isArray(book.entries) && book.name) {
        // 展示用的书名与介绍以 index.html 里的词书配置为准，
        // 这样数量文案不必依赖 books/*.json 是否可以修改
        const config = getBookConfig(book.id);
        // 总数按 entries 的实际去重词数统计，不再沿用文件里声明的 5000
        const uniqueCount = new Set(book.entries.map((entry) => entry && entry.word).filter(Boolean)).size;
        bookInfo = {
          id: book.id || BOOK_FALLBACK.id,
          name: (config && config.name) || book.name,
          intro: (config && config.intro) || book.intro || "",
          tiers: Array.isArray(book.tiers) ? book.tiers : BOOK_FALLBACK.tiers,
          declaredTotal: uniqueCount || 3534,
          importedCount: Number(book.importedCount) || 0,
          entries: book.entries
        };
      }
      // 词表 = 词书全部条目（3534），深度字段按需由 books/deep 分片覆盖
      if (book && Array.isArray(book.entries) && book.entries.length) {
        const known = new Map(words.map((item) => [item.word, item]));
        const ids = [...new Set(book.entries.map((entry) => entry && entry.word).filter(Boolean))];
        words = ids.map((wordId) => known.get(wordId) || normalizeEntry({ word: wordId }));
      }
      // prepared 是可选的首批深度词条（页面启动就能立刻显示一部分完整内容）
      if (Array.isArray(prepared)) {
        preparedEntries = prepared.filter((item) => item && item.word).map(normalizeEntry);
        const known = new Map(words.map((item) => [item.word, item]));
        preparedEntries.forEach((deep) => {
          const item = known.get(deep.word);
          if (!item) { words.push(deep); return; }
          Object.keys(deep).forEach((key) => { item[key] = deep[key]; });
          item.__deep = true;
        });
      }
      // 已入库数按整本词表统计
      bookInfo.importedCount = Math.max(Number(bookInfo.importedCount) || 0, words.length);
      if (distractors && Array.isArray(distractors.groups) && distractors.groups.length) {
        const valid = distractors.groups.filter((group) => group && Array.isArray(group.words));
        if (valid.length) distractorGroups = valid;
      }
      if (bookInfo.importedCount === 0) bookInfo.importedCount = words.length;
    }

    // 从现有存档里读出上次选中的词书，刷新后继续加载同一本
    function savedBookId() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (parsed && BOOKS.some((item) => item.id === parsed.bookId)) return parsed.bookId;
      } catch (error) {
        // 存档损坏时回退到默认词书
      }
      return DEFAULT_BOOK_ID;
    }

    // 读取一本书的全部深度词条批次；全部缺失时返回 null，页面走“尚未准备”
    async function fetchPreparedFiles(config) {
      const files = Array.isArray(config.preparedFiles) ? config.preparedFiles : [];
      if (!files.length) return null;
      const results = await Promise.allSettled(files.map((file) => fetchJson(file)));
      const fulfilled = results.filter((item) => item.status === "fulfilled");
      if (!fulfilled.length) return null;
      return fulfilled
        .flatMap((item) => (Array.isArray(item.value) ? item.value : []))
        .filter((item) => item && item.word);
    }

    // 按词书配置加载书信息、深度词条与干扰项；任一文件缺失都使用该书的兜底
    function loadBookBundle(config, done) {
      Promise.allSettled([
        fetchJson(config.bookFile),
        fetchPreparedFiles(config),
        fetchJson(config.distractorsFile)
      ]).then((results) => {
        const value = (index) => (results[index].status === "fulfilled" ? results[index].value : null);
        applyBookData(value(0) || config.fallback, value(1), value(2));
        // 首批深度词条缺失不影响整本词表；逐词内容仍由 books/deep 分片按需加载
        if (typeof done === "function") done();
      }).catch(() => {
        applyBookData(config.fallback || BOOK_FALLBACK, null, null);
        preparedEntries = [];
        if (typeof done === "function") done();
      });
    }

    // 切换词书：清空当日新学队列，按新词书重新抽词；选择结果随存档持久化
    function switchBook(bookId) {
      const config = getBookConfig(bookId);
      if (!config || !BOOKS.some((item) => item.id === config.id)) return;
      if (config.id === state.bookId) return;
      activeBookConfig = config;
      state.bookId = config.id;
      const dailyOptions = config.dailyOptions || [10, 15, 20];
      if (!dailyOptions.includes(state.dailyTarget)) state.dailyTarget = dailyOptions[0];
      resetLearnSession();
      saveState();
      // 先把标题与介绍切到新书，再异步加载词条
      bookInfo = {
        id: config.id,
        name: config.name,
        intro: config.intro,
        tiers: [],
        declaredTotal: 3534,
        importedCount: 0,
        entries: []
      };
      preparedEntries = [];
      words = [];
      if (location.protocol === "file:") {
        if (config.fallback) {
          bookInfo = config.fallback;
          preparedEntries = config.id === DEFAULT_BOOK_ID
            ? WORDS_FALLBACK.groups[0].map(normalizeEntry)
            : [];
          words = preparedEntries;
          bookInfo.importedCount = Math.max(Number(bookInfo.importedCount) || 0, preparedEntries.length);
        }
        applyDeepFallbackWords();
        renderAll();
        return;
      }
      renderAll();
      loadBookBundle(config, () => {
        saveState();
        renderAll();
      });
    }

    // file:// 下拿不到词书 json，用深度索引补出整本词表（3534 个轻量词条）
    function applyDeepFallbackWords() {
      if (!deepWords.length || words.length >= deepWords.length) return;
      const known = new Map(words.map((item) => [item.word, item]));
      words = deepWords.map((wordId) => known.get(wordId) || normalizeEntry({ word: wordId }));
      preparedEntries = words;
      bookInfo.importedCount = Math.max(Number(bookInfo.importedCount) || 0, words.length);
    }

    function start() {
      activeBookConfig = getBookConfig(savedBookId());
      // 与词书加载并行；失败（含 file://）时静默保留内嵌兜底
      loadQuotes();
      // 深度索引用 <script> 加载，file:// 下同样可用；就绪后再决定走哪条词书路径
      loadDeepIndex(() => {
        // 双击打开时是 file://，fetch 本地 json 会被 CORS 拦，用索引补全词表
        if (location.protocol === "file:") {
          applyDeepFallbackWords();
          boot();
          return;
        }
        loadBookBundle(activeBookConfig, boot);
      });
    }

    start();
  </script>
